apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    {{- include "safespot-ops.labels" . | nindent 4 }}
    {{- include "safespot-ops.dashboardLabels" . | nindent 4 }}
data:
  overview.json: |
{{ .Files.Get "dashboards/overview.json" | indent 4 }}

  application.json: |
{{ .Files.Get "dashboards/application.json" | indent 4 }}

  redis.json: |
{{ .Files.Get "dashboards/redis.json" | indent 4 }}

  postgres.json: |
{{ .Files.Get "dashboards/postgres.json" | indent 4 }}

  worker.json: |
{{ .Files.Get "dashboards/worker.json" | indent 4 }}