apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-public-read
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    {{- include "safespot-ops.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.services.apiPublicRead.appLabel }}
  endpoints:
    - port: {{ .Values.services.apiPublicRead.metricsPortName }}
      path: {{ .Values.services.apiPublicRead.metricsPath }}
      interval: {{ .Values.global.scrapeInterval }}
  namespaceSelector:
    matchNames:
      - {{ .Values.namespaces.application }}