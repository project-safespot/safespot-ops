apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: safespot-ops
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: safespot
    app.kubernetes.io/component: ops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: safespot
  source:
    repoURL: https://github.com/project-safespot/safespot-ops.git
    targetRevision: main
    path: charts/safespot-ops
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Validate=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
