apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: safespot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/project-safespot/safespot-ops.git
    targetRevision: main
    path: charts/safespot
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true