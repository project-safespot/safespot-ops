apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: safespot-external-ingestion
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: safespot

  source:
    repoURL: https://github.com/project-safespot/safespot-ops.git
    targetRevision: aws
    path: charts/external-ingestion
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: safespot

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m