apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: safespot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "SafeSpot 로컬 테스트 환경 — 전체 애플리케이션 프로젝트"

  sourceRepos:
    - https://github.com/project-safespot/safespot-ops.git
    - https://charts.bitnami.com/bitnami
    - https://prometheus-community.github.io/helm-charts
    - https://helm.localstack.cloud

  destinations:
    - server: https://kubernetes.default.svc
      namespace: application
    - server: https://kubernetes.default.svc
      namespace: worker
    - server: https://kubernetes.default.svc
      namespace: safespot-db        # PostgreSQL + PostgreSQL Exporter
    - server: https://kubernetes.default.svc
      namespace: safespot-cache     # Redis + Redis Exporter
    - server: https://kubernetes.default.svc
      namespace: safespot-localstack
    - server: https://kubernetes.default.svc
      namespace: monitoring

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  orphanedResources:
    warn: true

  roles:
    - name: developer
      description: "읽기 및 수동 sync 권한"
      policies:
        - p, proj:safespot:developer, applications, get, safespot/*, allow
        - p, proj:safespot:developer, applications, sync, safespot/*, allow
        - p, proj:safespot:developer, applications, create, safespot/*, deny
        - p, proj:safespot:developer, applications, delete, safespot/*, deny
    - name: ci
      description: "CI 파이프라인 sync 전용 권한"
      policies:
        - p, proj:safespot:ci, applications, get, safespot/*, allow
        - p, proj:safespot:ci, applications, sync, safespot/*, allow
        