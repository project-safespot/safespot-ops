name: Monitoring Validate

on:
  push:
    branches:
      - main
    paths:
      - "monitoring/**"
      - "charts/safespot-ops/**"
      - "argocd/**"
      - ".github/workflows/monitoring-validate.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "monitoring/**"
      - "charts/safespot-ops/**"
      - "argocd/**"
      - ".github/workflows/monitoring-validate.yaml"

jobs:
  lint-static-yaml:
    name: Lint Static YAML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install --break-system-packages yamllint

      - name: Write yamllint config
        run: |
          cat <<'EOF' > .yamllint.yaml
          extends: default
          rules:
            line-length:
              max: 200
            truthy:
              allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
            comments:
              min-spaces-from-content: 1
          EOF

      - name: Lint argocd and monitoring YAML
        run: |
          yamllint -c .yamllint.yaml argocd/

          if [ -d monitoring ]; then
            yamllint -c .yamllint.yaml monitoring/
          fi

  validate-helm-chart:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    needs: lint-static-yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint charts/safespot-ops \
            -f charts/safespot-ops/values-dev.yaml

      - name: Helm template
        run: |
          helm template safespot-ops charts/safespot-ops \
            -f charts/safespot-ops/values-dev.yaml \
            > rendered-ops.yaml

      - name: Check rendered manifest exists
        run: |
          test -s rendered-ops.yaml

  validate-prometheus-rules:
    name: Validate PrometheusRules
    runs-on: ubuntu-latest
    needs: validate-helm-chart

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install promtool
        run: |
          PROM_VERSION="2.51.0"
          wget -q "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf "prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          sudo mv "prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/

      - name: Render Helm manifests
        run: |
          helm template safespot-ops charts/safespot-ops \
            -f charts/safespot-ops/values-dev.yaml \
            > rendered-ops.yaml

      - name: Extract and validate PrometheusRule PromQL
        run: |
          pip install -q pyyaml

          python3 <<'PYEOF'
          import yaml
          import subprocess
          import sys

          with open("rendered-ops.yaml", encoding="utf-8") as fh:
              docs = list(yaml.safe_load_all(fh))

          groups = []

          for doc in docs:
              if not isinstance(doc, dict):
                  continue

              if doc.get("kind") != "PrometheusRule":
                  continue

              metadata = doc.get("metadata", {})
              name = metadata.get("name", "unknown")
              rule_groups = doc.get("spec", {}).get("groups", [])

              print(f"▶ Found PrometheusRule: {name}")
              groups.extend(rule_groups)

          if not groups:
              print("No PrometheusRule groups found. Skipping promtool validation.")
              sys.exit(0)

          rule_file = {"groups": groups}

          with open("/tmp/rule_check.yaml", "w", encoding="utf-8") as out:
              yaml.safe_dump(rule_file, out, sort_keys=False)

          result = subprocess.run(
              ["promtool", "check", "rules", "/tmp/rule_check.yaml"],
              capture_output=True,
              text=True
          )

          print(result.stdout)

          if result.returncode != 0:
              print(result.stderr)
              sys.exit(1)
          PYEOF

  notify:
    name: Notify Validation Success
    runs-on: ubuntu-latest
    needs:
      - lint-static-yaml
      - validate-helm-chart
      - validate-prometheus-rules

    steps:
      - name: Print result
        run: |
          echo "✅ Static YAML lint passed."
          echo "✅ Helm chart validation passed."
          echo "✅ PrometheusRule validation passed."
          echo "Argo CD will sync safespot-ops from charts/safespot-ops."