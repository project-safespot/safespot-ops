# charts/api-core/values-dev.yaml
# -----------------------------------------------------------------------
# image.repository / image.tag 는 GitHub Actions app-build-gitops.yml 이 자동 수정
# 그 외 값은 사람이 직접 관리
# -----------------------------------------------------------------------

image:
  repository: ""      # GitHub Actions 자동 설정
  tag: ""             # GitHub Actions 자동 설정 (sha-xxxxxxx)
  pullPolicy: Always

# -----------------------------------------------------------------------
# api-core: admin write 전용 → 외부 트래픽 적음
# replicaCount 2 = 최소 HA 구성
# -----------------------------------------------------------------------
replicaCount: 2

service:
  type: ClusterIP
  port: 8080
  
ingress:
  enabled: true

# -----------------------------------------------------------------------
# 리소스: dev 기준
# -----------------------------------------------------------------------
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

# -----------------------------------------------------------------------
# HPA: api-core 는 admin write path → public read 보다 트래픽 낮음
# maxReplicas 6 으로 제한
# -----------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------
# Probe 설정 (Spring Boot Actuator)
#
# readiness: DB / Redis / SQS 연결 포함
#   → 연결 실패 시 트래픽 차단 (CrashLoopBackOff 방지)
#   → initialDelaySeconds 30: Spring Boot 기동 시간 확보
#
# liveness: 프로세스 생존 여부만
#   → DB 일시 장애로 Pod 재시작되는 것 방지
#   → initialDelaySeconds 를 readiness 보다 길게 설정
# -----------------------------------------------------------------------
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 3

# -----------------------------------------------------------------------
# sync-wave: 배포 순서 제어
#   configmap: -1 (Deployment 보다 먼저)
#   service:    1
#   deployment: 2
#   hpa:        4 (Deployment 정상 기동 후)
# -----------------------------------------------------------------------
syncWave:
  configmap: "-1"
  service: "1"
  deployment: "2"
  hpa: "4"

# -----------------------------------------------------------------------
# 비민감 환경변수 (ConfigMap 에 저장)
# DB_HOST, DB_PASSWORD, REDIS_HOST, SQS_QUEUE_URL 등 민감 정보는
# Kubernetes Secret 에 저장하고 secretRef 로 주입
# -----------------------------------------------------------------------
config:
  SPRING_PROFILES_ACTIVE: "dev"
  AWS_REGION: "ap-northeast-2"
  SERVER_PORT: "8080"
  # RDS fallback: Spring Boot HikariCP 설정
  HIKARI_CONNECTION_TIMEOUT: "30000"
  HIKARI_INITIALIZATION_FAIL_TIMEOUT: "60000"
  # SQS
  SQS_QUEUE_NAME: "safespot-cache-refresh"
  # MVP: 서울만 지원
  SERVICE_REGION: "seoul"

# -----------------------------------------------------------------------
# Secret 참조 이름 (Kubernetes Secret 은 별도 관리)
# Secrets Manager → External Secrets Operator → Kubernetes Secret
# -----------------------------------------------------------------------
secretRef:
  name: safespot-api-core-secret