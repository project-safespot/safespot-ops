apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-core
    release: {{ .Release.Name }}
    version: {{ .Values.image.tag | quote }}
  # -----------------------------------------------------------------------
  # sync-wave: 2
  # ConfigMap(wave -1) → Service(wave 1) 생성 완료 후 Pod 생성
  # -----------------------------------------------------------------------
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave.deployment | quote }}

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-core
      release: {{ .Release.Name }}

  # -----------------------------------------------------------------------
  # RollingUpdate: 무중단 배포
  #   maxUnavailable: 0   → 배포 중 항상 최소 replicaCount 유지
  #   maxSurge: 1         → 한 번에 1개씩 새 Pod 추가
  # -----------------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: api-core
        release: {{ .Release.Name }}
        version: {{ .Values.image.tag | quote }}

    spec:
      # -----------------------------------------------------------------------
      # Init Container: RDS 연결 대기
      #
      # api-core 는 시작 즉시 RDS 에 write → DB 준비 전 기동 방지
      # DB_HOST 는 Secret 에서 주입
      # nc(netcat) 으로 5432 포트 오픈 확인 후 main container 시작
      # -----------------------------------------------------------------------
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z "${DB_HOST}" 5432; do
                echo "RDS 준비 대기 중..."
                sleep 5
              done
              echo "RDS 연결 확인 완료"
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.name }}
                  key: DB_HOST

      containers:
        - name: api-core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          # -----------------------------------------------------------------------
          # 환경변수 주입 순서
          # 1. Secret (DB_HOST, DB_PASSWORD, JWT_SECRET, SQS_QUEUE_URL 등)
          # 2. ConfigMap (SPRING_PROFILES_ACTIVE, AWS_REGION 등 비민감 설정)
          # 동일 키가 있으면 나중에 선언된 값이 우선 (Secret → ConfigMap 순)
          # -----------------------------------------------------------------------
          envFrom:
            - secretRef:
                name: {{ .Values.secretRef.name }}
            - configMapRef:
                name: {{ .Release.Name }}-config

          # -----------------------------------------------------------------------
          # readinessProbe: DB / SQS 연결 포함
          #   → 연결 실패 시 Service 트래픽에서 제외
          #   → failureThreshold 6 = 60초간 유예 (Spring Boot 기동 완료 대기)
          #
          # livenessProbe: 프로세스 생존 여부만
          #   → DB 일시 장애로 Pod 가 계속 재시작되는 것 방지
          #   → initialDelaySeconds 를 readiness 보다 길게 설정
          # -----------------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}