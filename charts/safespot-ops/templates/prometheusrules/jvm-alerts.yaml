# ======================================================
# jvm-alerts.yaml
# 대상: application, worker namespace의 Spring Boot 서비스
# ======================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: safespot-jvm-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: safespot.jvm
      interval: 15s
      rules:
        - alert: JvmHeapHighUsage
          expr: |
            (
              jvm_memory_used_bytes{area="heap", namespace=~"application|worker"}
              / jvm_memory_max_bytes{area="heap", namespace=~"application|worker"}
            ) > 0.85
          for: 5m
          labels:
            severity: warning
            env: dev
          annotations:
            summary: "JVM heap usage high ({{ $labels.pod }})"
            description: "JVM heap usage is above 85% for pod {{ $labels.pod }} in {{ $labels.namespace }}."

        - alert: JvmGcPauseHigh
          expr: |
            rate(jvm_gc_pause_seconds_sum{namespace=~"application|worker"}[1m])
            / rate(jvm_gc_pause_seconds_count{namespace=~"application|worker"}[1m]) > 0.5
          for: 5m
          labels:
            severity: warning
            env: dev
          annotations:
            summary: "JVM GC pause high ({{ $labels.pod }})"
            description: "JVM GC average pause time exceeds 500ms for pod {{ $labels.pod }}."

        - alert: JvmThreadsHigh
          expr: |
            jvm_threads_live_threads{namespace=~"application|worker"} > 200
          for: 5m
          labels:
            severity: warning
            env: dev
          annotations:
            summary: "JVM live threads high ({{ $labels.pod }})"
            description: "JVM live thread count exceeds 200 for pod {{ $labels.pod }}."
