# ======================================================
# postgres-alerts.yaml
# 대상: safespot-db namespace
# Bitnami 내장 postgres-exporter 메트릭 기준
# ======================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: safespot-postgres-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: safespot.postgres
      interval: 15s
      rules:
        - alert: PostgresDown
          expr: pg_up{namespace="safespot-db"} == 0
          for: 3m
          labels:
            severity: critical
            env: dev
            namespace: safespot-db
          annotations:
            summary: "PostgreSQL is down"
            description: "PostgreSQL instance in safespot-db is not responding."

        - alert: PostgresHighConnections
          expr: |
            (
              pg_stat_activity_count{namespace="safespot-db"}
              / pg_settings_max_connections{namespace="safespot-db"}
            ) > 0.80
          for: 5m
          labels:
            severity: warning
            env: dev
            namespace: safespot-db
          annotations:
            summary: "PostgreSQL connections high"
            description: "PostgreSQL active connections exceed 80% of max_connections."

        - alert: PostgresDeadlocks
          expr: |
            rate(pg_stat_database_deadlocks{namespace="safespot-db"}[5m]) > 0
          for: 2m
          labels:
            severity: warning
            env: dev
            namespace: safespot-db
          annotations:
            summary: "PostgreSQL deadlocks detected"
            description: "PostgreSQL is experiencing deadlocks in database {{ $labels.datname }}."
