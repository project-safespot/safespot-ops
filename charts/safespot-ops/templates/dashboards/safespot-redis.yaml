# ======================================================
# safespot-redis Dashboard ConfigMap
# 대상: safespot-cache namespace Redis 현황
# Bitnami 내장 redis-exporter 메트릭 기준
# ======================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-safespot-redis
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  safespot-redis.json: |
    {
      "title": "SafeSpot Redis",
      "uid": "safespot-redis",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "tags": ["safespot", "redis"],
      "time": { "from": "now-1h", "to": "now" },
      "templating": { "list": [] },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "title": "Redis Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "redis_up{namespace=\"safespot-cache\"}",
              "legendFormat": "up"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "메모리 사용량 (bytes)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "redis_memory_used_bytes{namespace=\"safespot-cache\"}",
              "legendFormat": "used"
            },
            {
              "expr": "redis_memory_max_bytes{namespace=\"safespot-cache\"}",
              "legendFormat": "max"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 3,
          "title": "연결된 클라이언트 수",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "redis_connected_clients{namespace=\"safespot-cache\"}",
              "legendFormat": "clients"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 4,
          "title": "Hit/Miss Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(redis_keyspace_hits_total{namespace=\"safespot-cache\"}[1m])",
              "legendFormat": "hits/s"
            },
            {
              "expr": "rate(redis_keyspace_misses_total{namespace=\"safespot-cache\"}[1m])",
              "legendFormat": "misses/s"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 5,
          "title": "Commands 처리량 (ops/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(redis_commands_processed_total{namespace=\"safespot-cache\"}[1m])",
              "legendFormat": "commands/s"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        }
      ]
    }
