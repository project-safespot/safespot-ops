# ======================================================
# safespot-worker Dashboard ConfigMap
# 대상: worker namespace (async-worker) 현황
# ======================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-safespot-worker
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  safespot-worker.json: |
    {
      "title": "SafeSpot Worker",
      "uid": "safespot-worker",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "tags": ["safespot", "worker"],
      "time": { "from": "now-1h", "to": "now" },
      "templating": { "list": [] },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "title": "Worker Pods Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{condition=\"true\", namespace=\"worker\"})",
              "legendFormat": "ready"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Pod 재시작 횟수",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(kube_pod_container_status_restarts_total{namespace=\"worker\"}[15m])",
              "legendFormat": "{{`{{ pod }}`}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 3,
          "title": "JVM Heap 사용률",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\", namespace=\"worker\"} / jvm_memory_max_bytes{area=\"heap\", namespace=\"worker\"}",
              "legendFormat": "{{`{{ pod }}`}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit" } }
        }
      ]
    }
