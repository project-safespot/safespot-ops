# ======================================================
# safespot-application Dashboard ConfigMap
# 대상: application namespace HTTP 요청/응답 현황
# ======================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-safespot-application
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  safespot-application.json: |
    {
      "title": "SafeSpot Application",
      "uid": "safespot-application",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "tags": ["safespot", "application"],
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(jvm_memory_used_bytes{namespace=\"application\"}, service)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "label": "Service"
          }
        ]
      },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "title": "HTTP 요청 수 (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by(service) (rate(http_server_requests_seconds_count{namespace=\"application\", service=~\"$service\"}[1m]))",
              "legendFormat": "{{ service }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 2,
          "title": "HTTP 오류율 (5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by(service) (rate(http_server_requests_seconds_count{namespace=\"application\", service=~\"$service\", status=~\"5..\"}[1m]))",
              "legendFormat": "{{ service }} 5xx"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 3,
          "title": "HTTP 응답 지연 p99 (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by(service, le) (rate(http_server_requests_seconds_bucket{namespace=\"application\", service=~\"$service\"}[1m])))",
              "legendFormat": "{{ service }} p99"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 4,
          "title": "HTTP 응답 지연 p50 (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by(service, le) (rate(http_server_requests_seconds_bucket{namespace=\"application\", service=~\"$service\"}[1m])))",
              "legendFormat": "{{ service }} p50"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        }
      ]
    }
