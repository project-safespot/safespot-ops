# ======================================================
# redis-exporter ServiceMonitor
# namespace: monitoring
# exporter 위치: safespot-cache (Redis와 함께 배치)
# ======================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - safespot-cache
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-redis-exporter
      app.kubernetes.io/instance: redis-exporter
  endpoints:
    - port: redis-exporter
      path: /metrics
      interval: 15s
