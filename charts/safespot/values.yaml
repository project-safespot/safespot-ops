global:
  env: dev
  region: seoul
  releaseLabel: monitoring
  scrapeInterval: 15s
  grafanaDashboardLabel: grafana_dashboard
  grafanaDashboardLabelValue: "1"

namespaces:
  monitoring: monitoring
  application: application
  worker: worker
  db: safespot-db
  cache: safespot-cache

services:
  apiCore:
    appLabel: api-core
    metricsPortName: http
    metricsPath: /actuator/prometheus
  apiPublicRead:
    appLabel: api-public-read
    metricsPortName: http
    metricsPath: /actuator/prometheus
  externalIngestion:
    appLabel: external-ingestion
    metricsPortName: http
    metricsPath: /actuator/prometheus
  asyncWorker:
    appLabel: async-worker
    metricsPortName: http
    metricsPath: /actuator/prometheus
  postgresExporter:
    appLabel: postgres-exporter
    metricsPortName: http
    metricsPath: /metrics
  redisExporter:
    appLabel: redis-exporter
    metricsPortName: http
    metricsPath: /metrics

kube-prometheus-stack:
  grafana:
    enabled: true
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: monitoring

  alertmanager:
    enabled: false

  prometheus:
    enabled: true
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelector:
        matchLabels:
          release: monitoring
      serviceMonitorNamespaceSelector:
        matchNames:
          - monitoring
          - application
          - worker
          - safespot-db
          - safespot-cache
      scrapeInterval: 15s
      evaluationInterval: 15s

  defaultRules:
    create: true

  kubeStateMetrics:
    enabled: true

  nodeExporter:
    enabled: true