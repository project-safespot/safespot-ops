apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-api-public-read
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "safespot-observability.labels" . | nindent 4 }}
    {{- include "safespot-observability.dashboardLabel" . | nindent 4 }}
data:
  api-public-read-dashboard.json: |
    {
      "uid": "safespot-api-public-read",
      "title": "SafeSpot — api-public-read",
      "tags": ["safespot", "api-public-read", "cache"],
      "timezone": "Asia/Seoul",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [

        {
          "id": 1,
          "title": "TPS — 핵심 엔드포인트",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{service=\"api-public-read\",uri=~\"/shelters/nearby|/disaster-alerts|/disasters.*\"}[1m])) by (uri)",
              "legendFormat": "{{ "{{uri}}" }}"
            }
          ]
        },

        {
          "id": 2,
          "title": "Latency p95 / p99 — 핵심 엔드포인트 (초)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service=\"api-public-read\",uri=~\"/shelters/nearby|/disaster-alerts|/disasters.*\"}[1m])) by (le, uri))",
              "legendFormat": "p95 {{ "{{uri}}" }}"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{service=\"api-public-read\",uri=~\"/shelters/nearby|/disaster-alerts|/disasters.*\"}[1m])) by (le, uri))",
              "legendFormat": "p99 {{ "{{uri}}" }}"
            }
          ]
        },

        {
          "id": 3,
          "title": "Cache Hit / Miss / Down / ParseError (endpoint별)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(api_read_cache_request_total{service=\"api-public-read\"}[1m])) by (endpoint, result)",
              "legendFormat": "{{ "{{endpoint}}" }} / {{ "{{result}}" }}"
            }
          ]
        },

        {
          "id": 4,
          "title": "Cache Hit Ratio (endpoint별)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "(\n  sum(rate(api_read_cache_request_total{service=\"api-public-read\",result=\"hit\"}[5m])) by (endpoint)\n/\n  sum(rate(api_read_cache_request_total{service=\"api-public-read\"}[5m])) by (endpoint)\n)",
              "legendFormat": "hit ratio {{ "{{endpoint}}" }}"
            }
          ]
        },

        {
          "id": 5,
          "title": "DB Fallback 발생 (reason별)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 8, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(api_read_cache_fallback_total{service=\"api-public-read\"}[1m])) by (endpoint, reason)",
              "legendFormat": "{{ "{{endpoint}}" }} / {{ "{{reason}}" }}"
            }
          ]
        },

        {
          "id": 6,
          "title": "DB Fallback Query 수 / Latency p95",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 12, "w": 8, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(api_read_db_fallback_query_total{service=\"api-public-read\"}[1m])) by (endpoint)",
              "legendFormat": "fallback query {{ "{{endpoint}}" }}"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(api_read_db_fallback_latency_seconds_bucket{service=\"api-public-read\"}[1m])) by (le, endpoint))",
              "legendFormat": "fallback p95 {{ "{{endpoint}}" }}"
            }
          ]
        },

        {
          "id": 7,
          "title": "Cache Regeneration 요청 / 생략 / 발행 결과",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 12, "w": 8, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(api_read_cache_regen_requested_total{service=\"api-public-read\"}[1m])) by (endpoint)",
              "legendFormat": "requested {{ "{{endpoint}}" }}"
            },
            {
              "expr": "sum(rate(api_read_cache_regen_suppressed_total{service=\"api-public-read\"}[1m])) by (endpoint)",
              "legendFormat": "suppressed {{ "{{endpoint}}" }}"
            },
            {
              "expr": "sum(rate(api_read_cache_regen_publish_total{service=\"api-public-read\",result=\"failure\"}[1m])) by (endpoint)",
              "legendFormat": "publish_fail {{ "{{endpoint}}" }}"
            }
          ]
        },

        {
          "id": 8,
          "title": "cache_key_family별 Hit / Miss",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 18, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(cache_hit_total{service=\"api-public-read\"}[1m])) by (cache_key_family)",
              "legendFormat": "hit {{ "{{cache_key_family}}" }}"
            },
            {
              "expr": "sum(rate(cache_miss_total{service=\"api-public-read\"}[1m])) by (cache_key_family)",
              "legendFormat": "miss {{ "{{cache_key_family}}" }}"
            }
          ]
        },

        {
          "id": 9,
          "title": "disaster_messages_list — Payload Size / Hot Key",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 18, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "redis_payload_size_bytes{cache_key_family=\"disaster_messages_list\"}",
              "legendFormat": "payload size (bytes)"
            },
            {
              "expr": "sum(rate(redis_hot_key_detected_total{cache_key_family=\"disaster_messages_list\"}[1m]))",
              "legendFormat": "hot key detected/min"
            }
          ]
        },

        {
          "id": 10,
          "title": "5xx Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 4 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "(\n  sum(rate(http_server_requests_seconds_count{service=\"api-public-read\",status=~\"5..\"}[1m]))\n/\n  sum(rate(http_server_requests_seconds_count{service=\"api-public-read\"}[1m]))\n) * 100",
              "legendFormat": "5xx rate %"
            }
          ]
        }

      ]
    }