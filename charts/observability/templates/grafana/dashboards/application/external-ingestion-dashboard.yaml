apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-external-ingestion
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "safespot-observability.labels" . | nindent 4 }}
    {{- include "safespot-observability.dashboardLabel" . | nindent 4 }}
data:
  external-ingestion-dashboard.json: |
    {
      "uid": "safespot-external-ingestion",
      "title": "SafeSpot — external-ingestion",
      "tags": ["safespot", "ingestion"],
      "timezone": "Asia/Seoul",
      "refresh": "60s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [

        {
          "id": 1,
          "title": "Polling Loop 실행 / Skip (source별)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(ingestion_polling_loop_iteration_total{service=\"external-ingestion\"}[5m])) by (source)",
              "legendFormat": "run {{ "{{source}}" }}"
            },
            {
              "expr": "sum(rate(ingestion_polling_loop_skipped_total{service=\"external-ingestion\"}[5m])) by (source, reason)",
              "legendFormat": "skip {{ "{{source}}" }}/{{ "{{reason}}" }}"
            }
          ]
        },

        {
          "id": 2,
          "title": "외부 API 호출 / 실패 / Retry (source별)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(ingestion_external_api_call_total{service=\"external-ingestion\"}[5m])) by (source)",
              "legendFormat": "call {{ "{{source}}" }}"
            },
            {
              "expr": "sum(rate(ingestion_external_api_failure_total{service=\"external-ingestion\"}[5m])) by (source, type)",
              "legendFormat": "fail {{ "{{source}}" }}/{{ "{{type}}" }}"
            },
            {
              "expr": "sum(rate(ingestion_external_api_retry_total{service=\"external-ingestion\"}[5m])) by (source)",
              "legendFormat": "retry {{ "{{source}}" }}"
            }
          ]
        },

        {
          "id": 3,
          "title": "외부 API Latency p95 (source별, 초)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(ingestion_external_api_latency_seconds_bucket{service=\"external-ingestion\"}[5m])) by (le, source))",
              "legendFormat": "p95 {{ "{{source}}" }}"
            }
          ]
        },

        {
          "id": 4,
          "title": "Last Success 경과 시간 (source별, 초)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "time() - ingestion_last_success_timestamp{service=\"external-ingestion\"}",
              "legendFormat": "stale {{ "{{source}}" }} (초)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  { "value": 0,   "color": "green" },
                  { "value": 600, "color": "yellow" },
                  { "value": 1800,"color": "red" }
                ]
              }
            }
          }
        },

        {
          "id": 5,
          "title": "Records Fetched / Normalized / Failed (source별)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(ingestion_records_fetched_total{service=\"external-ingestion\"}[5m])) by (source)",
              "legendFormat": "fetched {{ "{{source}}" }}"
            },
            {
              "expr": "sum(rate(ingestion_records_normalized_total{service=\"external-ingestion\"}[5m])) by (source)",
              "legendFormat": "normalized {{ "{{source}}" }}"
            },
            {
              "expr": "sum(rate(ingestion_records_failed_total{service=\"external-ingestion\"}[5m])) by (source)",
              "legendFormat": "failed {{ "{{source}}" }}"
            }
          ]
        },

        {
          "id": 6,
          "title": "정규화 실패 reason별",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(ingestion_normalization_failure_total{service=\"external-ingestion\"}[5m])) by (source, reason)",
              "legendFormat": "{{ "{{source}}" }}/{{ "{{reason}}" }}"
            }
          ]
        },

        {
          "id": 7,
          "title": "중복 Payload Skip (source별)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 18, "w": 8, "h": 4 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(ingestion_duplicate_payload_total{service=\"external-ingestion\"}[5m])) by (source)",
              "legendFormat": "dup {{ "{{source}}" }}"
            }
          ]
        },

        {
          "id": 8,
          "title": "Rate Limit 초과 (source별)",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 18, "w": 8, "h": 4 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(ingestion_external_api_rate_limit_exceeded_total{service=\"external-ingestion\"}[5m])) by (source)",
              "legendFormat": "rate_limit {{ "{{source}}" }}"
            }
          ]
        },

        {
          "id": 9,
          "title": "SQS Publish 성공 / 실패 (event_type별)",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 18, "w": 8, "h": 4 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(ingestion_sqs_publish_total{service=\"external-ingestion\"}[1m])) by (source, event_type)",
              "legendFormat": "ok {{ "{{source}}" }}/{{ "{{event_type}}" }}"
            },
            {
              "expr": "sum(rate(ingestion_sqs_publish_failure_total{service=\"external-ingestion\"}[1m])) by (source, event_type)",
              "legendFormat": "fail {{ "{{source}}" }}/{{ "{{event_type}}" }}"
            }
          ]
        }

      ]
    }