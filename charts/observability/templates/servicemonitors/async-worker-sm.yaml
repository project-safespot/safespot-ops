apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: async-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "safespot-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: async-worker
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.serviceMonitor.targetNamespace }}
  selector:
    matchLabels:
      {{- toYaml .Values.services.asyncWorker.selector | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.services.asyncWorker.metricsPath }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      # 주요 메트릭: worker_processed_total, worker_failures_total,
      #             worker_redis_write_total, worker_dlq_publish_total,
      #             cache_regeneration_*, worker_processing_duration_seconds