apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "safespot-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-exporter
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.serviceMonitor.targetNamespace }}
  selector:
    matchLabels:
      {{- toYaml .Values.services.redisExporter.selector | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.services.redisExporter.metricsPath }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      # 주요 메트릭: redis_keyspace_hits_total, redis_keyspace_misses_total,
      #             redis_memory_used_bytes, redis_memory_max_bytes,
      #             redis_connected_clients, redis_evicted_keys_total,
      #             redis_expired_keys_total, redis_slowlog_length