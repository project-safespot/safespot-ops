# SafeSpot Observability - values-dev-eks.yaml
# EKS dev 전용 설정. 인프라 식별자(endpoint, ARN)는 포함하지 않습니다.
#
# 실제 배포 시 반드시 values-dev.infra.generated.yaml을 함께 사용하세요:
#   AWS_PROFILE=<profile> ./scripts/render-dev-values.sh
#   helm install ... \
#     -f charts/safespot-observability/values-dev-eks.yaml \
#     -f charts/safespot-observability/values-dev.infra.generated.yaml
#
# 인프라 식별자(values-dev.infra.generated.yaml에서 주입됨):
#   - redis-exporter.redisAddress        → SSM: /safespot/dev/data/redis-primary-endpoint + redis-port
#   - yace.serviceAccount.annotations   → SSM: /safespot/dev/observability/yace/irsa-role-arn
#   - grafana.serviceAccount.annotations → SSM: /safespot/dev/observability/grafana/irsa-role-arn (optional)
#   - safespot.aws.sqs.*               → SSM: /safespot/dev/async-worker/*-queue-url (basename 파싱)
#
# Grafana admin credential (ExternalSecret이 SSM에서 자동 동기화):
#   - /safespot/dev/observability/grafana/admin-user
#   - /safespot/dev/observability/grafana/admin-password

kube-prometheus-stack:
  grafana:
    # adminPassword 평문 없음.
    # ExternalSecret(safespot.externalSecrets.grafanaAdmin)이 SSM에서 grafana-admin-credentials를 동기화합니다.
    admin:
      existingSecret: "grafana-admin-credentials"
      userKey: admin-user
      passwordKey: admin-password
    serviceAccount:
      create: true
      name: safespot-grafana
      # IRSA annotation은 values-dev.infra.generated.yaml에서 주입됩니다.
      # SSM: /safespot/dev/observability/grafana/irsa-role-arn (optional)
      annotations: {}
    service:
      type: ClusterIP
    persistence:
      enabled: true
      storageClassName: gp3
      size: 5Gi
    additionalDataSources:
      - name: CloudWatch
        type: cloudwatch
        jsonData:
          authType: default
          defaultRegion: ap-northeast-2
    nodeSelector:
      safespot.io/node-group: ops
    tolerations:
      - key: "safespot.io/dedicated"
        operator: "Equal"
        value: "ops"
        effect: "NoSchedule"
    # renderer Deployment/Service는 extraObjects로 직접 정의.
    # chart built-in imageRenderer는 비활성화 (values.yaml imageRenderer.enabled: false).
    # 이유: chart liveness probe httpGet 고정 → tcpSocket override 불가.
    # GF_RENDERING_* env는 imageRenderer.enabled: false 시 chart이 주입하지 않으므로 수동 설정.
    envValueFrom:
      GF_RENDERING_RENDERER_TOKEN:
        secretKeyRef:
          name: grafana-image-renderer-token
          key: token
    env:
      GF_RENDERING_SERVER_URL: "http://safespot-observability-dev-grafana-image-renderer.monitoring:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://safespot-observability-dev-grafana.monitoring:80/"
    extraObjects:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: grafana-image-renderer-token
          namespace: monitoring
        type: Opaque
        stringData:
          # TODO(운영): ExternalSecret(SSM /safespot/<env>/observability/grafana/renderer-token)으로 교체
          token: "safespot-dev-renderer-token-2025"
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: safespot-observability-dev-grafana-image-renderer
          namespace: monitoring
          labels:
            app.kubernetes.io/name: grafana-image-renderer
            app.kubernetes.io/instance: safespot-observability-dev
            app.kubernetes.io/component: image-renderer
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: grafana-image-renderer
              app.kubernetes.io/instance: safespot-observability-dev
          template:
            metadata:
              labels:
                app.kubernetes.io/name: grafana-image-renderer
                app.kubernetes.io/instance: safespot-observability-dev
            spec:
              containers:
                - name: grafana-image-renderer
                  image: grafana/grafana-image-renderer:3.11.6
                  imagePullPolicy: IfNotPresent
                  ports:
                    - name: http
                      containerPort: 8081
                      protocol: TCP
                  env:
                    - name: HTTP_PORT
                      value: "8081"
                    - name: AUTH_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: grafana-image-renderer-token
                          key: token
                  livenessProbe:
                    tcpSocket:
                      port: 8081
                    initialDelaySeconds: 30
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 6
                  readinessProbe:
                    tcpSocket:
                      port: 8081
                    initialDelaySeconds: 10
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 6
                  resources:
                    requests:
                      cpu: 250m
                      memory: 512Mi
                    limits:
                      cpu: 1000m
                      memory: 1Gi
                  volumeMounts:
                    - mountPath: /tmp
                      name: image-renderer-tmpfs
              nodeSelector:
                safespot.io/node-group: ops
              tolerations:
                - key: "safespot.io/dedicated"
                  operator: "Equal"
                  value: "ops"
                  effect: "NoSchedule"
              volumes:
                - name: image-renderer-tmpfs
                  emptyDir: {}
      - apiVersion: v1
        kind: Service
        metadata:
          name: safespot-observability-dev-grafana-image-renderer
          namespace: monitoring
          labels:
            app.kubernetes.io/name: grafana-image-renderer
            app.kubernetes.io/instance: safespot-observability-dev
        spec:
          type: ClusterIP
          ports:
            - name: http
              port: 8081
              targetPort: 8081
              protocol: TCP
          selector:
            app.kubernetes.io/name: grafana-image-renderer
            app.kubernetes.io/instance: safespot-observability-dev

  prometheus:
    serviceAccount:
      create: true
      name: prometheus
      annotations: {}
    service:
      type: ClusterIP
    prometheusSpec:
      retention: 7d
      resources:
        requests:
          cpu: "0.5"
          memory: 2Gi
        limits:
          cpu: "1.5"
          memory: 6Gi
      livenessProbe:
        httpGet:
          path: /-/healthy
          port: web
        initialDelaySeconds: 180
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /-/ready
          port: web
        initialDelaySeconds: 120
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 10
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      nodeSelector:
        safespot.io/node-group: ops
      tolerations:
        - key: "safespot.io/dedicated"
          operator: "Equal"
          value: "ops"
          effect: "NoSchedule"

  prometheusOperator:
    nodeSelector:
      safespot.io/node-group: ops
    tolerations:
      - key: "safespot.io/dedicated"
        operator: "Equal"
        value: "ops"
        effect: "NoSchedule"

  kube-state-metrics:
    nodeSelector:
      safespot.io/node-group: ops
    tolerations:
      - key: "safespot.io/dedicated"
        operator: "Equal"
        value: "ops"
        effect: "NoSchedule"

  alertmanager:
    service:
      type: ClusterIP
    alertmanagerSpec:
      secrets:
        - alertmanager-slack-webhook
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
      nodeSelector:
        safespot.io/node-group: ops
      tolerations:
        - key: "safespot.io/dedicated"
          operator: "Equal"
          value: "ops"
          effect: "NoSchedule"
    config:
      route:
        receiver: slack
        group_by:
          - namespace
        routes:
          - receiver: "null"
            matchers:
              - alertname="Watchdog"

      receivers:
        - name: "null"
        - name: slack
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/slack_webhook_url
              channel: "#더존비즈온팀프로젝트"
              send_resolved: true

              title: >-
                [{{ .Status | toUpper }}:{{ len .Alerts }}] {{ .CommonLabels.alertname }}{{ if .CommonLabels.namespace }} / ns={{ .CommonLabels.namespace }}{{ end }}

              text: |-
                {{ range .Alerts }}
                *Alert:* `{{ .Labels.alertname }}`
                *Status:* `{{ .Status }}`
                *Severity:* `{{ .Labels.severity }}`
                {{- if .Labels.namespace }}
                *Namespace:* `{{ .Labels.namespace }}`
                {{- end }}
                {{- if .Labels.pod }}
                *Pod:* `{{ .Labels.pod }}`
                {{- end }}
                {{- if .Labels.container }}
                *Container:* `{{ .Labels.container }}`
                {{- end }}
                {{- if .Labels.deployment }}
                *Deployment:* `{{ .Labels.deployment }}`
                {{- end }}
                {{- if .Labels.statefulset }}
                *StatefulSet:* `{{ .Labels.statefulset }}`
                {{- end }}
                {{- if .Labels.daemonset }}
                *DaemonSet:* `{{ .Labels.daemonset }}`
                {{- end }}
                {{- if .Labels.node }}
                *Node:* `{{ .Labels.node }}`
                {{- end }}
                {{- if .Labels.job }}
                *Job:* `{{ .Labels.job }}`
                {{- end }}
                {{- if .Labels.instance }}
                *Instance:* `{{ .Labels.instance }}`
                {{- end }}

                *문제 요약*
                {{- if .Annotations.summary }}
                {{ .Annotations.summary }}
                {{- else }}
                summary annotation 없음
                {{- end }}

                *상세 원인*
                {{- if .Annotations.description }}
                {{ .Annotations.description }}
                {{- else }}
                description annotation 없음
                {{- end }}

                *확인할 것*
                {{- if .Annotations.runbook }}
                {{ .Annotations.runbook }}
                {{- else if .Labels.pod }}
                1. `kubectl get pod -n {{ .Labels.namespace }} {{ .Labels.pod }}`
                2. `kubectl describe pod -n {{ .Labels.namespace }} {{ .Labels.pod }}`
                3. `kubectl logs -n {{ .Labels.namespace }} {{ .Labels.pod }} --previous`
                4. `kubectl get events -n {{ .Labels.namespace }} --sort-by=.lastTimestamp`
                {{- else if .Labels.job }}
                1. Prometheus UI > Status > Targets에서 `{{ .Labels.job }}` target의 last error 확인
                2. `kubectl get servicemonitor -A`
                3. `kubectl get endpoints -A | grep {{ .Labels.job }}`
                4. 대상 Service와 `/actuator/prometheus` endpoint 연결 상태 확인
                {{- else }}
                1. Alert label의 namespace/job/instance 기준으로 대상 리소스 확인
                2. Prometheus UI > Alerts 또는 Targets에서 상세 원인 확인
                3. Grafana에서 같은 시간대 CPU/Memory/Restart/Ready 상태 확인
                {{- end }}

                *시작 시각:* {{ .StartsAt }}
                {{- if eq .Status "resolved" }}
                *해결 시각:* {{ .EndsAt }}
                {{- end }}
                ---
                {{ end }}

# EKS context path 적용 (Ingress에서 path-prefix를 붙이는 경우)
safespot:
  externalSecrets:
    grafanaAdmin:
      enabled: true
      secretStoreRef:
        name: ssm-parameter-store
        kind: ClusterSecretStore
      adminUserParameter: /safespot/dev/observability/grafana/admin-user
      adminPasswordParameter: /safespot/dev/observability/grafana/admin-password

  dashboards:
    redis:
      enabled: true
    eks:
      enabled: true
    apiHttp:
      enabled: true
    # CloudWatch raw dashboard: IRSA 완료. aws.* 값은 values-dev.infra.generated.yaml에서 주입.
    # 값이 없으면 패널이 "No data"로 표시되지만 배포는 정상.
    cloudwatchRaw:
      enabled: true
    systemOverview:
      enabled: true
    apiCustom:
      enabled: true
    appOverview:
      enabled: true
    jvmGc:
      enabled: true
    loadtest:
      enabled: true
    safeSpotNormalStateOverview:
      enabled: true
    safeSpotDisasterSurgeScalingOverview:
      enabled: true

  prometheusRules:
    redis:
      enabled: true
    apiHttp:
      enabled: true
    eks:
      enabled: true
    apiCustom:
      enabled: false

  # AWS 리소스 식별자: values-dev.infra.generated.yaml에서 실제 값으로 오버라이드됩니다.
  # scripts/render-dev-values.sh 실행 후 배포하세요.
  aws:
    rds:
      dbClusterIdentifier: ""
    elasticache:
      replicationGroupId: ""
    sqs:
      eventQueueName: ""
      cacheRefreshQueueName: ""
      readmodelRefreshQueueName: ""
      environmentCacheRefreshQueueName: ""
      cacheRefreshDlqName: ""
      readmodelRefreshDlqName: ""
      environmentCacheRefreshDlqName: ""
    lambda:
      asyncWorkerFunctionName: ""
    alb:
      loadBalancerDimension: ""

  metrics:
    apiCore:
      path: /api/core/actuator/prometheus
      port: http
      interval: 15s
    apiPublicRead:
      path: /api/public/actuator/prometheus
      port: http
      interval: 15s
    externalIngestion:
      path: /actuator/prometheus
      port: http
      interval: 15s
    asyncWorker:
      path: /actuator/prometheus
      port: http
      interval: 15s

# Prometheus 원본 metric: http_server_requests_seconds_count
# HPA external metric: http_request_per_second
# plural 형태(http_requests_per_second)는 사용하지 않습니다.
prometheus-adapter:
  enabled: true

  prometheus:
    url: http://safespot-observability-dev-prometheus.monitoring.svc
    port: 9090

  nodeSelector:
    safespot.io/node-group: ops
  tolerations:
    - key: "safespot.io/dedicated"
      operator: "Equal"
      value: "ops"
      effect: "NoSchedule"

  rules:
    default: false

    external:
      - seriesQuery: 'http_server_requests_seconds_count{namespace!="",service!=""}'

        resources:
          overrides:
            namespace:
              resource: namespace

        name:
          as: "http_request_per_second"

        metricsQuery: >
          sum(
            rate(
              http_server_requests_seconds_count{
                <<.LabelMatchers>>,
                uri!~"/actuator.*|UNKNOWN"
              }[1m]
            )
          )

# prometheus-redis-exporter — EKS dev 활성화
# redisAddress는 values-dev.infra.generated.yaml에서 주입됩니다 (SSM 기반).
# scripts/render-dev-values.sh 실행 후 배포하세요.
redis-exporter:
  enabled: true
  serviceAccount:
    create: true
  redisAddress: "redis://TODO_GENERATED_VALUE:TODO_GENERATED_PORT"
  serviceMonitor:
    enabled: true
    interval: 30s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    safespot.io/node-group: ops
  tolerations:
    - key: "safespot.io/dedicated"
      operator: "Equal"
      value: "ops"
      effect: "NoSchedule"

# subchart ServiceMonitor 사용 — 수동 SM 비활성 유지
redisExporterExternalServiceMonitor:
  enabled: false

fluent-bit:
  enabled: true

  serviceAccount:
    create: true
    name: safespot-fluent-bit
    annotations:
      # values-dev.infra.generated.yaml이 실제 ARN으로 오버라이드합니다.
      # SSM: /safespot/dev/observability/fluent-bit/irsa-role-arn
      # Terraform trust policy subject: system:serviceaccount:monitoring:safespot-fluent-bit
      eks.amazonaws.com/role-arn: "TODO_GENERATED_VALUE"
  tolerations:
    - operator: Exists
  config:
    service: |
      [SERVICE]
          Flush         5
          Log_Level     info
          Daemon        off
          Parsers_File  parsers.conf
          HTTP_Server   On
          HTTP_Listen   0.0.0.0
          HTTP_Port     2020

    inputs: |
      [INPUT]
          Name              tail
          Path              /var/log/containers/*.log
          Parser            cri
          Tag               kube.*
          Refresh_Interval  5
          Mem_Buf_Limit     10MB
          Skip_Long_Lines   On

    filters: |
      [FILTER]
          Name                kubernetes
          Match               kube.*
          Kube_URL            https://kubernetes.default.svc:443
          Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
          Merge_Log           On
          Keep_Log            Off
          K8S-Logging.Parser  On
          K8S-Logging.Exclude Off

    outputs: |
      [OUTPUT]
          Name                cloudwatch_logs
          Match               kube.*
          region              ap-northeast-2
          log_group_name      /safespot/dev/application
          log_stream_prefix   from-fluent-bit-
          auto_create_group   true

# yet-another-cloudwatch-exporter — EKS dev 활성화
# IRSA role ARN은 values-dev.infra.generated.yaml에서 주입됩니다 (SSM 기반).
# Terraform trust policy subject: system:serviceaccount:monitoring:safespot-yace
yace:
  enabled: true
  serviceAccount:
    create: true
    name: "safespot-yace"
    annotations:
      # values-dev.infra.generated.yaml이 실제 ARN으로 오버라이드합니다.
      eks.amazonaws.com/role-arn: "TODO_GENERATED_VALUE"
  serviceMonitor:
    enabled: true
    interval: 60s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  nodeSelector:
    safespot.io/node-group: ops
  tolerations:
    - key: "safespot.io/dedicated"
      operator: "Equal"
      value: "ops"
      effect: "NoSchedule"
  testConnection: false
  config: |-
    apiVersion: v1alpha1
    sts-region: ap-northeast-2
    discovery:
      exportedTagsOnMetrics:
        AWS/RDS:
          - Name
        AWS/ElastiCache:
          - Name
        AWS/ApplicationELB:
          - ingress.k8s.aws/stack
          - elbv2.k8s.aws/cluster
          - service.k8s.aws/stack
      jobs:
        # Aurora RDS
        # TODO: searchTags.value를 Aurora 클러스터에 실제 부여된 AWS 태그 값으로 교체하세요
        - type: AWS/RDS
          regions:
            - ap-northeast-2
          searchTags:
            - key: Name
              value: safespot-dev-data-aurora-cluster
          metrics:
            - name: CPUUtilization
              statistics:
                - Average
              period: 60
              length: 300
            - name: DatabaseConnections
              statistics:
                - Average
              period: 60
              length: 300
            - name: ReadLatency
              statistics:
                - Average
                - Maximum
              period: 60
              length: 300
            - name: WriteLatency
              statistics:
                - Average
                - Maximum
              period: 60
              length: 300
            - name: AuroraReplicaLag
              statistics:
                - Average
                - Maximum
              period: 60
              length: 300
            - name: VolumeBytesUsed
              statistics:
                - Average
              period: 60
              length: 300
        # ElastiCache
        # TODO: searchTags.value를 ElastiCache replication group에 실제 부여된 AWS 태그 값으로 교체하세요
        - type: AWS/ElastiCache
          regions:
            - ap-northeast-2
          searchTags:
            - key: Name
              value: safespot-dev-data-redis-main
          metrics:
            - name: EngineCPUUtilization
              statistics:
                - Average
              period: 60
              length: 300
            - name: Evictions
              statistics:
                - Sum
              period: 60
              length: 300
            - name: CurrConnections
              statistics:
                - Average
              period: 60
              length: 300
            - name: FreeableMemory
              statistics:
                - Average
              period: 60
              length: 300
            - name: BytesUsedForCache
              statistics:
                - Average
              period: 60
              length: 300
        # ContainerInsights
        # TODO: searchTags.value를 EKS 클러스터에 실제 부여된 AWS 태그 값으로 교체하세요
        - type: ContainerInsights
          regions:
            - ap-northeast-2
          searchTags:
            - key: Name
              value: safespot-dev-eks
          dimensionNameRequirements:
            - ClusterName
            - NodeName
          metrics:
            - name: node_cpu_utilization
              statistics:
                - Average
              period: 60
              length: 300
            - name: node_memory_utilization
              statistics:
                - Average
              period: 60
              length: 300
        # ApplicationELB — LoadBalancer dimension (ALB 전체 집계)
        # TODO: searchTags.value를 ALB에 실제 부여된 AWS Name 태그 값으로 교체하세요
        # IRSA 역할에 elasticloadbalancing:DescribeLoadBalancers, tag:GetResources 권한 추가 필요
        - type: AWS/ApplicationELB
          regions:
            - ap-northeast-2
          searchTags:
            - key: ingress.k8s.aws/stack
              value: safespot-dev-api
          dimensionNameRequirements:
            - LoadBalancer
          metrics:
            - name: RequestCount
              statistics:
                - Sum
              period: 60
              length: 300
            - name: TargetResponseTime
              statistics:
                - Average
                - Maximum
              period: 60
              length: 300
            - name: HTTPCode_ELB_4XX_Count
              statistics:
                - Sum
              period: 60
              length: 300
            - name: HTTPCode_ELB_5XX_Count
              statistics:
                - Sum
              period: 60
              length: 300
            - name: ActiveConnectionCount
              statistics:
                - Sum
              period: 60
              length: 300
            - name: NewConnectionCount
              statistics:
                - Sum
              period: 60
              length: 300
            - name: RejectedConnectionCount
              statistics:
                - Sum
              period: 60
              length: 300
        # ApplicationELB — LoadBalancer+TargetGroup dimension (Target Group 별 breakdown)
        # TODO: searchTags.value를 위와 동일한 ALB Name 태그 값으로 교체하세요
        - type: AWS/ApplicationELB
          regions:
            - ap-northeast-2
          searchTags:
            - key: ingress.k8s.aws/stack
              value: safespot-dev-api
          dimensionNameRequirements:
            - LoadBalancer
            - TargetGroup
          metrics:
            - name: HTTPCode_Target_2XX_Count
              statistics:
                - Sum
              period: 60
              length: 300
            - name: HTTPCode_Target_4XX_Count
              statistics:
                - Sum
              period: 60
              length: 300
            - name: HTTPCode_Target_5XX_Count
              statistics:
                - Sum
              period: 60
              length: 300
            - name: TargetConnectionErrorCount
              statistics:
                - Sum
              period: 60
              length: 300
    static:
      # SQS Queues
      # TODO: dimensions[].value를 실제 SQS 큐 이름으로 교체하세요 (Terraform output 또는 AWS 콘솔 확인)
      #       교체 완료 후 아래 주석(#)을 해제하세요.
      #
      # - namespace: AWS/SQS
      #   name: sqs-cache-refresh
      #   regions:
