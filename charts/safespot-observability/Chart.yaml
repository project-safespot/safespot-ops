apiVersion: v2
name: safespot-observability
description: >
  SafeSpot 전용 관측성 Helm Chart.
  Prometheus + Grafana + Alertmanager + redis-exporter
  ServiceMonitor / PrometheusRule / Dashboard ConfigMap 포함.
  AWS 메트릭 시각화: Grafana CloudWatch Datasource (IRSA 기반 직접 조회)
  AWS 메트릭 알람: CloudWatch Alarms → SNS → Slack (Terraform ops 모듈 관리)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    # 배포 전 반드시 최신 버전 확인 후 교체
    # helm search repo prometheus-community/kube-prometheus-stack
    version: "65.8.1"
    repository: "https://prometheus-community.github.io/helm-charts"

  # ❌ cloudwatch-exporter dependency 제거
  # 사유: AWS 메트릭 알람은 CloudWatch Alarms가 전담
  #       Grafana 시각화는 CloudWatch Datasource로 직접 조회
  #       → Exporter Pod 운영 불필요

  # redis-exporter: Prometheus 알람 대상이므로 유지
  # Helm subchart 방식 대신 templates/exporters/redis-exporter.yaml로 직접 관리
  # (별도 chart 의존성 추가 시 아래 주석 해제)
  # - name: prometheus-redis-exporter
  #   version: "x.x.x"
  #   repository: "https://prometheus-community.github.io/helm-charts"