apiVersion: v2
name: safespot-observability
description: SafeSpot 전용 관측성 Helm Chart (ServiceMonitor / PrometheusRule / Dashboard)
type: application
version: 0.2.0

dependencies:
  - name: kube-prometheus-stack
    version: "84.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: prometheus-redis-exporter
    alias: redis-exporter
    version: "6.23.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: redis-exporter.enabled
  - name: yet-another-cloudwatch-exporter
    alias: yace
    version: "0.39.1"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: yace.enabled
  - name: prometheus-adapter
    alias: prometheus-adapter
    version: "5.2.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus-adapter.enabled
  - name: fluent-bit
    version: "0.50.0"
    repository: "https://fluent.github.io/helm-charts"
    condition: fluent-bit.enabled