# ============================================================
# values-aws-dev.yaml
# AWS EKS dev 환경
# IRSA ARN / ElastiCache endpoint / StorageClass 주입
# ============================================================

safespot:
  env: dev
  region: ap-northeast-2

kube-prometheus-stack:

  grafana:
    adminPassword: ""   # AWS Secrets Manager 또는 K8s Secret 참조 권장
    # existingSecret: grafana-admin-secret

    service:
      type: ClusterIP   # ALB Ingress 또는 포트포워딩으로 접근

    # Grafana → CloudWatch API 접근용 IRSA
    # CloudWatch Datasource로 AWS 메트릭 + Logs 직접 조회
    # 필요 IAM 권한: cloudwatch:GetMetricData, logs:StartQuery, logs:GetQueryResults 등
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/safespot-dev-ops-grafana-cloudwatch"

    additionalDataSources:
      - name: Prometheus
        type: prometheus
        url: http://safespot-observability-kube-prometheus-stack-prometheus:9090
        isDefault: true
        access: proxy
        jsonData:
          timeInterval: "30s"

      # ── CloudWatch Datasource ──────────────────────────────
      # 메트릭: RDS, SQS, Lambda, ALB, NAT GW (ap-northeast-2)
      #         CloudFront, WAF (us-east-1)
      # 로그:   /safespot/dev/eks/fluent-bit
      #         /safespot/dev/rds/slow-query
      #         /safespot/dev/alb/access-log
      #         /safespot/dev/waf
      #         /safespot/dev/vpc/flow-log
      # 인증:   Grafana ServiceAccount IRSA (위 annotations ARN)
      - name: CloudWatch
        type: cloudwatch
        access: proxy
        jsonData:
          authType: default          # IRSA 사용 (EC2 IAM Role / pod identity)
          defaultRegion: ap-northeast-2
          # us-east-1 메트릭(CloudFront/WAF)은 패널별 region 오버라이드로 처리
        isDefault: false

  prometheus:
    service:
      type: ClusterIP

    prometheusSpec:
      retention: 15d
      retentionSize: "10GB"

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp2
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

      resources:
        requests:
          memory: 2Gi
          cpu: 500m
        limits:
          memory: 4Gi
          cpu: 1000m

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp2
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

# ── redis-exporter ───────────────────────────────────────────
# Prometheus 알람 대상 — exporter 유지 (IRSA 불필요, VPC 내부 접속)
redis-exporter:
  enabled: true

  serviceAccount:
    annotations: {}

  # ElastiCache primary endpoint (Terraform output 참조)
  # safespot-dev-data-redis-primary.xxxxxx.0001.apn2.cache.amazonaws.com
  redisAddress: "redis://ELASTICACHE_PRIMARY_ENDPOINT:6379"

  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# ── ❌ cloudwatch-exporter 제거 ───────────────────────────────
# AWS 메트릭 알람 → CloudWatch Alarms (Terraform ops 모듈)
# Grafana 시각화 → CloudWatch Datasource (위 additionalDataSources)