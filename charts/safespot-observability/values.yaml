# SafeSpot Observability - values.yaml
# 공통 기본값. 환경별 오버라이드는 values-local.yaml / values-dev-eks.yaml 사용.

kube-prometheus-stack:
  grafana:
    service:
      type: ClusterIP
    # GF_RENDERING_SERVER_URL / GF_RENDERING_CALLBACK_URL는
    # imageRenderer.enabled: true 시 chart이 자동 생성합니다.
    # 수동 env 설정 불필요 — 서비스명이 release name에 따라 달라지므로 chart 자동값을 사용합니다.
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
    # image-renderer AUTH_TOKEN 비활성화를 위한 빈 토큰 Secret을 extraObjects로 주입합니다.
    # existingSecret 설정 시 chart 자동 생성 Secret(랜덤 토큰)은 생성되지 않습니다.
    # AUTH_TOKEN="" → renderer auth 비활성 → liveness probe httpGet /render/version → 200 OK
    extraObjects:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: grafana-image-renderer-no-auth
          namespace: monitoring
        type: Opaque
        stringData:
          token: ""
    imageRenderer:
      enabled: true
      replicas: 1
      image:
        repository: grafana/grafana-image-renderer
        # v3.6.0+ 에서 /render/version 엔드포인트 지원
        # v3.0.1은 /healthz (chart 기본값)를 지원하지 않아 liveness probe 404 발생
        tag: "3.11.6"
      # healthcheckPath: chart가 liveness probe httpGet.path에 사용하는 단일 설정값
      # v3.0.1 이하: "/" 사용 / v3.6.0+: "/render/version" 사용 / v5.0.0+: "/healthz" 사용
      healthcheckPath: /render/version
      # existingSecret: 빈 토큰 Secret 지정 → AUTH_TOKEN="" → renderer auth 비활성
      # chart 자동 Secret(랜덤 토큰) 생성 억제
      existingSecret: "grafana-image-renderer-no-auth"
      service:
        enabled: true
        portName: http
        port: 8081
        targetPort: 8081
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
  prometheus:
    service:
      type: ClusterIP
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}

  alertmanager:
    service:
      type: ClusterIP

# SafeSpot 공통 설정
safespot:
  env: dev
  region: ap-northeast-2
  namespace:
    application: application
    monitoring: monitoring
  metrics:
    apiCore:
      path: /actuator/prometheus
      port: http
      interval: 15s
    apiPublicRead:
      path: /actuator/prometheus
      port: http
      interval: 15s
    externalIngestion:
      path: /actuator/prometheus
      port: http
      interval: 15s
    asyncWorker:
      path: /actuator/prometheus
      port: http
      interval: 15s
  # ExternalSecret으로 Grafana admin credential을 SSM에서 동기화
  # external-secrets operator가 설치된 경우 enabled: true로 설정
  externalSecrets:
    grafanaAdmin:
      enabled: false
      secretStoreRef:
        name: ssm-parameter-store
        kind: ClusterSecretStore
      targetSecretName: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
      # 환경별 SSM 경로는 values-dev-eks.yaml 등 환경 values에서 지정
      adminUserParameter: ""
      adminPasswordParameter: ""
      refreshInterval: "1h"

  # Dashboard enable/disable flags
  dashboards:
    redis:
      enabled: true
    eks:
      enabled: true
    apiHttp:
      enabled: true
    cloudwatchRaw:
      enabled: false
    systemOverview:
      enabled: false
    apiCustom:
      enabled: false
    appOverview:
      enabled: false
    jvmGc:
      enabled: false
    worker:
      enabled: false
    ingestion:
      enabled: false
    loadtest:
      enabled: false

  # PrometheusRule enable/disable flags
  prometheusRules:
    redis:
      enabled: true
    apiHttp:
      enabled: true
    eks:
      enabled: true
    apiCustom:
      enabled: false
    worker:
      enabled: false
    ingestion:
      enabled: false

  # API HTTP 메트릭 PromQL 필터
  api:
    servicesFilter: "api-core|api-public-read"

  # AWS 리소스 식별자 (기본값 빈 문자열)
  # values-dev.infra.generated.yaml 에서 실제 값으로 오버라이드됩니다.
  aws:
    rds:
      dbClusterIdentifier: ""
    elasticache:
      replicationGroupId: ""
    sqs:
      eventQueueName: ""
      cacheRefreshQueueName: ""
      readmodelRefreshQueueName: ""
      environmentCacheRefreshQueueName: ""
      cacheRefreshDlqName: ""
      readmodelRefreshDlqName: ""
      environmentCacheRefreshDlqName: ""
    lambda:
      asyncWorkerFunctionName: ""
    alb:
      loadBalancerDimension: ""

# Alert 임계값
alerts:
  redis:
    memoryUsageMax: "0.85"
    evictionRateMax: "0"
  api:
    errorRateThresholdPercent: "5"
    latencyP95ThresholdSeconds: "2.0"

# prometheus-adapter subchart (alias: prometheus-adapter)
# condition: prometheus-adapter.enabled — 기본 비활성. 환경별 values에서 활성화.
prometheus-adapter:
  enabled: false

# prometheus-redis-exporter subchart (alias: redis-exporter)
# condition: redis-exporter.enabled — 기본 비활성. 환경별 values에서 활성화.
redis-exporter:
  enabled: false
  serviceAccount:
    create: true
  # TODO: EKS dev ElastiCache Redis primary endpoint 확인 후 설정
  redisAddress: "redis://TODO_FILL_IN_ELASTICACHE_PRIMARY_ENDPOINT:6379"
  # TODO: Terraform 기준 transit_encryption_enabled=false 확인됨.
  # Redis AUTH 사용 여부 확인 필요. AUTH가 없으면 아래 env 블록 불필요.
  # env:
  #   - name: REDIS_PASSWORD
  #     valueFrom:
  #       secretKeyRef:
  #         name: redis-auth
  #         key: password
  serviceMonitor:
    enabled: false
    interval: 30s
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# yet-another-cloudwatch-exporter subchart (alias: yace)
# condition: yace.enabled — 기본 비활성. 환경별 values에서 활성화.
yace:
  enabled: false
  serviceAccount:
    create: true
    name: "safespot-yace"
    annotations: {}
  serviceMonitor:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  testConnection: false

# 수동 Redis ServiceMonitor (templates/servicemonitors/servicemonitor-redis-exporter.yaml)
# redisExporter.serviceMonitor.enabled=true 사용 시 false 유지하여 중복 방지
redisExporterExternalServiceMonitor:
  enabled: false

# fluent-bit subchart
# EKS Pod stdout 로그를 CloudWatch Logs로 전송
fluent-bit:
  enabled: false