# ============================================================
# safespot-observability values.yaml
# 공통 기본값 — 모든 환경에 적용
# 환경별 오버라이드: values-local.yaml / values-aws-dev.yaml / values-aws-prod.yaml
# ============================================================

# ------------------------------------------------------------
# SafeSpot 공통 메타
# ------------------------------------------------------------
safespot:
  env: dev
  region: ap-northeast-2
  namespace:
    monitoring: monitoring
    application: application

# ------------------------------------------------------------
# kube-prometheus-stack 오버라이드
# ------------------------------------------------------------
kube-prometheus-stack:

  # ── Grafana ──────────────────────────────────────────────
  grafana:
    adminPassword: admin1234   # values-aws-*.yaml에서 Secret 참조로 교체 권장
    service:
      type: ClusterIP          # 외부 노출 X — Ingress 또는 포트포워딩으로 접근
    defaultDashboardsEnabled: true

    # Grafana → CloudWatch API 접근용 IRSA
    # values-aws-*.yaml에서 실제 ARN 주입, values-local.yaml에서는 annotations: {}
    serviceAccount:
      create: true
      name: grafana
      annotations: {}

    # Datasource ConfigMap sidecar — grafana_datasource: "1" label 감지해서 자동 로드
    # Prometheus: 기본 datasource (values로 직접 주입)
    # CloudWatch: grafana/datasources/datasource-cloudwatch.yaml ConfigMap으로 주입
    additionalDataSources:
      - name: Prometheus
        type: prometheus
        url: http://safespot-observability-kube-prometheus-stack-prometheus:9090
        isDefault: true
        access: proxy
        jsonData:
          timeInterval: "30s"
      # CloudWatch datasource는 values-aws-*.yaml에서 추가
      # values-local.yaml에서는 이 목록만 유지 (CloudWatch 항목 없음)

    # Dashboard ConfigMap sidecar — grafana_dashboard: "1" label 감지해서 자동 로드
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL   # 전체 네임스페이스 대상
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        searchNamespace: ALL

  # ── Prometheus ───────────────────────────────────────────
  prometheus:
    service:
      type: ClusterIP          # 외부 노출 X

    prometheusSpec:
      # 네임스페이스 무관하게 ServiceMonitor 전체 감지
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
      ruleNamespaceSelector: {}

      # 보존 기간 / 스토리지 — 환경별 오버라이드
      retention: 15d
      retentionSize: "10GB"

  # ── Alertmanager ─────────────────────────────────────────
  # 담당 범위: 앱(latency/error rate), Redis, EKS(node/pod/PVC)
  # AWS 리소스 알람(RDS, SQS, Lambda, ALB, CloudFront, WAF, NAT GW)은
  # CloudWatch Alarms → SNS → Slack 별도 경로로 처리
  alertmanager:
    service:
      type: ClusterIP

    alertmanagerSpec:
      # 스토리지 — 환경별 storageClass 오버라이드 필수
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: ""   # values-local / values-aws에서 반드시 지정
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

  # ── node-exporter ────────────────────────────────────────
  nodeExporter:
    enabled: true

  # ── kube-state-metrics ───────────────────────────────────
  kubeStateMetrics:
    enabled: true

  # ── 기본 PrometheusRule (kube-prometheus-stack 내장) ─────
  defaultRules:
    create: true
    rules:
      alertmanager: true
      etcd: false                   # EKS 관리형 — etcd 접근 불가
      configReloaders: true
      general: true
      k8s: true
      kubeApiserverAvailability: true
      kubeApiserverBurnrate: true
      kubeApiserverHistogram: true
      kubeApiserverSlos: true
      kubeControllerManager: false  # EKS 관리형 — 접근 불가
      kubelet: true
      kubeProxy: false              # EKS 관리형 — 접근 불가
      kubeSchedulerAlerting: false  # EKS 관리형 — 접근 불가
      kubeSchedulerRecording: false
      kubeStateMetrics: true
      network: true
      node: true
      nodeExporterAlerting: true
      nodeExporterRecording: true
      prometheus: true
      prometheusOperator: true

# ------------------------------------------------------------
# redis-exporter 공통 설정
# ElastiCache Redis → Prometheus 수집 (VPC 내부 직접 접속)
# Prometheus 알람 대상이므로 exporter 유지 (IRSA 불필요)
# ------------------------------------------------------------
redis-exporter:
  enabled: true

  serviceAccount:
    create: true
    name: redis-exporter

  service:
    port: 9121

  # redisAddress: values-aws-*.yaml에서 ElastiCache endpoint 주입
  redisAddress: ""

# ------------------------------------------------------------
# ❌ cloudwatch-exporter 완전 제거
# 사유: AWS 메트릭 알람은 CloudWatch Alarms가 전담
#       Grafana 시각화는 CloudWatch Datasource로 직접 조회
#       → Exporter Pod / IRSA / scrape 오버헤드 불필요
# ------------------------------------------------------------