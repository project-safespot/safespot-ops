apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-core
  namespace: {{ .Values.safespot.namespace.monitoring }}
  labels:
    release: kube-prometheus-stack
    app: api-core
    env: {{ .Values.safespot.env }}
    region: {{ .Values.safespot.region }}
spec:
  selector:
    matchLabels:
      app: api-core
      env: {{ .Values.safespot.env }}
  namespaceSelector:
    matchNames:
      - {{ .Values.safespot.namespace.application }}
  endpoints:
    - port: {{ .Values.safespot.metrics.apiCore.port }}
      path: {{ .Values.safespot.metrics.apiCore.path }}
      interval: {{ .Values.safespot.metrics.apiCore.interval }}
