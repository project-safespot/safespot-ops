apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-system-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    env: dev
    region: ap-northeast-2
data:
  system-overview.json: |
    {{- `
    {
      "title": "SafeSpot - System Overview",
      "uid": "safespot-overview",
      "tags": ["safespot", "overview"],
      "timezone": "Asia/Seoul",
      "schemaVersion": 36,
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(http_server_requests_seconds_count, service)",
            "refresh": 2,
            "multi": true,
            "includeAll": true
          },
          {
            "name": "env",
            "type": "constant",
            "query": "dev"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "전체 요청 수 (TPS)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{service=~\"$service\"}[1m])) by (service)",
              "legendFormat": "{{ service }}"
            }
          ]
        },
        {
          "id": 2,
          "title": "5xx 에러율",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\", service=~\"$service\"}[1m])) by (service) / sum(rate(http_server_requests_seconds_count{service=~\"$service\"}[1m])) by (service)",
              "legendFormat": "{{ service }} 5xx rate"
            }
          ]
        },
        {
          "id": 3,
          "title": "API latency p99",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{service=~\"$service\"}[1m])) by (le, service))",
              "legendFormat": "{{ service }} p99"
            }
          ]
        },
        {
          "id": 4,
          "title": "Pod Restart 수",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"application\"}[10m])) by (pod)",
              "legendFormat": "{{ pod }}"
            }
          ]
        }
      ]
    }
    ` -}}
