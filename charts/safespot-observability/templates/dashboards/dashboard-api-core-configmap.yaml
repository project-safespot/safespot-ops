{{- if .Values.safespot.dashboards.apiCustom.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-api-core
  namespace: {{ .Values.safespot.namespace.monitoring }}
  labels:
    grafana_dashboard: "1"
    env: {{ .Values.safespot.env }}
    region: {{ .Values.safespot.region }}
data:
  api-core.json: |
    {
      "uid": "safespot-api-core",
      "title": "SafeSpot — api-core",
      "tags": ["safespot", "api-core"],
      "timezone": "Asia/Seoul",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "HTTP Metrics",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 2,
          "title": "TPS by URI (actuator 제외)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (uri) (rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",uri!~\"/actuator.*|UNKNOWN\"}[1m]))",
              "legendFormat": "{{ "{{uri}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 3,
          "title": "Latency p50 / p95 / p99 (actuator 제외)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",uri!~\"/actuator.*|UNKNOWN\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",uri!~\"/actuator.*|UNKNOWN\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",uri!~\"/actuator.*|UNKNOWN\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3 } }
        },
        {
          "id": 4,
          "title": "4xx Error Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >1% for 5m",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",status=~\"4..\",uri!~\"/actuator.*|UNKNOWN\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",uri!~\"/actuator.*|UNKNOWN\"}[5m]))",
              "legendFormat": "4xx rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }
            }
          }
        },
        {
          "id": 5,
          "title": "5xx Error Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >1% for 5m",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",status=~\"5..\",uri!~\"/actuator.*|UNKNOWN\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",uri!~\"/actuator.*|UNKNOWN\"}[5m]))",
              "legendFormat": "5xx rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }
            }
          }
        },
        {
          "id": 10,
          "title": "JVM Heap",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "panels": []
        },
        {
          "id": 11,
          "title": "Heap Total Usage % (Warning >80%, Critical >90%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 18 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >80% for 5m | Critical: >90% for 5m",
          "targets": [
            {
              "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",area=\"heap\"}) / sum by (pod) (jvm_memory_max_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",area=\"heap\"})",
              "legendFormat": "{{ "{{pod}}" }} heap 사용률"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.8 }, { "color": "red", "value": 0.9 }] }
            }
          }
        },
        {
          "id": 12,
          "title": "Heap by Pool: Eden / Survivor — bytes (used)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 18 },
          "datasource": { "uid": "prometheus" },
          "description": "Eden/Survivor는 JVM에 따라 max가 부정확하므로 used bytes 절대값으로 표시. Old Gen은 우측 패널 참조.",
          "targets": [
            {
              "expr": "sum by (pod, id) (jvm_memory_used_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",area=\"heap\",id!~\".*[Oo]ld.*\"})",
              "legendFormat": "{{ "{{pod}}" }} / {{ "{{id}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 13,
          "title": "Old Gen Usage % (Warning >70%, Critical >85%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 18 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >70% for 5m | Critical: >85% for 5m — Full GC 전조",
          "targets": [
            {
              "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",area=\"heap\",id=~\".*[Oo]ld.*\"}) / sum by (pod) (jvm_memory_max_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",area=\"heap\",id=~\".*[Oo]ld.*\"})",
              "legendFormat": "{{ "{{pod}}" }} Old Gen"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.85 }] }
            }
          }
        },
        {
          "id": 14,
          "title": "Non-Heap Usage (Metaspace / CodeCache 등)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 26 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod, id) (jvm_memory_used_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\",area=\"nonheap\"})",
              "legendFormat": "{{ "{{pod}}" }} / {{ "{{id}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 20,
          "title": "GC",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 34 },
          "panels": []
        },
        {
          "id": 21,
          "title": "GC Pause Time Ratio (Warning >5%, Critical >10%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 35 },
          "datasource": { "uid": "prometheus" },
          "description": "초당 GC 소비 시간 비율. 0.05=5%(warning), 0.10=10%(critical)",
          "targets": [
            {
              "expr": "sum by (pod) (rate(jvm_gc_pause_seconds_sum{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}[1m]))",
              "legendFormat": "{{ "{{pod}}" }} GC time ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.05 }, { "color": "red", "value": 0.1 }] }
            }
          }
        },
        {
          "id": 22,
          "title": "GC Pause Count by Cause",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 35 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod, action, cause) (rate(jvm_gc_pause_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}[1m]))",
              "legendFormat": "{{ "{{pod}}" }} {{ "{{action}}" }} ({{ "{{cause}}" }})"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 23,
          "title": "Average GC Pause (Warning >200ms, Critical >1s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 35 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >200ms | Critical: >1s",
          "targets": [
            {
              "expr": "sum by (pod) (rate(jvm_gc_pause_seconds_sum{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}[5m])) / sum by (pod) (rate(jvm_gc_pause_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}[5m]))",
              "legendFormat": "{{ "{{pod}}" }} avg pause"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.2 }, { "color": "red", "value": 1.0 }] }
            }
          }
        },
        {
          "id": 24,
          "title": "Max GC Pause",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 43 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "max by (pod, action, cause) (jvm_gc_pause_seconds_max{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} {{ "{{action}}" }} ({{ "{{cause}}" }})"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3 } }
        },
        {
          "id": 25,
          "title": "Allocation Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 43 },
          "datasource": { "uid": "prometheus" },
          "description": "jvm_gc_memory_allocated_bytes_total — metric 없으면 No data (application 노출 필요)",
          "targets": [
            {
              "expr": "sum by (pod) (rate(jvm_gc_memory_allocated_bytes_total{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}[1m]))",
              "legendFormat": "{{ "{{pod}}" }} alloc rate"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        },
        {
          "id": 26,
          "title": "Promoted Bytes Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 43 },
          "datasource": { "uid": "prometheus" },
          "description": "jvm_gc_memory_promoted_bytes_total — metric 없으면 No data (application 노출 필요)",
          "targets": [
            {
              "expr": "sum by (pod) (rate(jvm_gc_memory_promoted_bytes_total{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}[1m]))",
              "legendFormat": "{{ "{{pod}}" }} promoted rate"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        },
        {
          "id": 27,
          "title": "Live Data Size",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 43 },
          "datasource": { "uid": "prometheus" },
          "description": "jvm_gc_live_data_size_bytes — metric 없으면 No data (application 노출 필요)",
          "targets": [
            {
              "expr": "max by (pod) (jvm_gc_live_data_size_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} live data"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 30,
          "title": "Container / CPU",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 51 },
          "panels": []
        },
        {
          "id": 31,
          "title": "Container Memory Working Set (Warning >85%, Critical >95%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 52 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >85% of limit | Critical: >95% of limit",
          "targets": [
            {
              "expr": "sum by (pod, container) (container_memory_working_set_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",container=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} working set"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 32,
          "title": "Memory Limit Usage % (Warning >85%, Critical >95%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 52 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >85% | Critical: >95%",
          "targets": [
            {
              "expr": "sum by (pod, container) (container_memory_working_set_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",container=\"api-core\"}) / sum by (pod, container) (kube_pod_container_resource_limits{namespace=\"{{ .Values.safespot.namespace.application }}\",container=\"api-core\",resource=\"memory\"})",
              "legendFormat": "{{ "{{pod}}" }} mem limit %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.85 }, { "color": "red", "value": 0.95 }] }
            }
          }
        },
        {
          "id": 33,
          "title": "JVM vs Container Memory Gap (off-heap 추정)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 52 },
          "datasource": { "uid": "prometheus" },
          "description": "container working_set - JVM total used = native/off-heap/direct buffer 추정값",
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",container=\"api-core\"}) - sum by (pod) (jvm_memory_used_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} off-heap gap"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 34,
          "title": "CPU Usage by Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 60 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"{{ .Values.safespot.namespace.application }}\",container=\"api-core\"}[1m]))",
              "legendFormat": "{{ "{{pod}}" }} cpu"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "cores", "decimals": 3 } }
        },
        {
          "id": 35,
          "title": "CPU Throttling Ratio (Warning >20%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 60 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >20% throttled",
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"{{ .Values.safespot.namespace.application }}\",pod=~\"api-core.*\",container!=\"\",image!=\"\"}[1m])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"{{ .Values.safespot.namespace.application }}\",pod=~\"api-core.*\",container!=\"\",image!=\"\"}[1m]))",
              "legendFormat": "{{ "{{pod}}" }} throttle ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.2 }] }
            }
          }
        },
        {
          "id": 40,
          "title": "JVM Threads / Optional Tomcat Debug",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 68 },
          "panels": []
        },
        {
          "id": 41,
          "title": "JVM Live Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 69 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "jvm_threads_live_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}",
              "legendFormat": "{{ "{{pod}}" }} live threads"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 42,
          "title": "JVM Peak Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 69 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "jvm_threads_peak_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}",
              "legendFormat": "{{ "{{pod}}" }} peak threads"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 43,
          "title": "Optional Debug - Tomcat Busy Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 69 },
          "datasource": { "uid": "prometheus" },
          "description": "tomcat_threads_* is not currently exposed by api-public-read actuator. Treat No data as application metric not exposed, not a scrape failure.",
          "targets": [
            {
              "expr": "sum by (pod) (tomcat_threads_busy_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} tomcat busy"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 44,
          "title": "Optional Debug - Tomcat Busy Ratio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 69 },
          "datasource": { "uid": "prometheus" },
          "description": "tomcat_threads_* is not currently exposed by api-public-read actuator. Treat No data as application metric not exposed, not a scrape failure.",
          "targets": [
            {
              "expr": "sum by (pod) (tomcat_threads_busy_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}) / sum by (pod) (tomcat_threads_config_max_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} busy ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          }
        },
        {
          "id": 46,
          "title": "Optional Debug - Tomcat Current Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 77 },
          "datasource": { "uid": "prometheus" },
          "description": "tomcat_threads_* is not currently exposed by api-public-read actuator. Treat No data as application metric not exposed, not a scrape failure.",
          "targets": [
            {
              "expr": "sum by (pod) (tomcat_threads_current_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} tomcat current"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 45,
          "title": "Optional Debug - Tomcat Max Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 77 },
          "datasource": { "uid": "prometheus" },
          "description": "tomcat_threads_* is not currently exposed by api-public-read actuator. Treat No data as application metric not exposed, not a scrape failure.",
          "targets": [
            {
              "expr": "sum by (pod) (tomcat_threads_config_max_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} tomcat max"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 50,
          "title": "Hikari DB Connection Pool",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 85 },
          "panels": []
        },
        {
          "id": 51,
          "title": "Hikari Active Connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 86 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (hikaricp_connections_active{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} active"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 52,
          "title": "Hikari Idle Connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 86 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (hikaricp_connections_idle{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} idle"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 53,
          "title": "Hikari Pending Connections (Critical >0)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 86 },
          "datasource": { "uid": "prometheus" },
          "description": "Critical: >0 — connection pool 포화 가능성",
          "targets": [
            {
              "expr": "sum by (pod) (hikaricp_connections_pending{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} pending"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] }
            }
          }
        },
        {
          "id": 54,
          "title": "Hikari Pool Usage %",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 86 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (hikaricp_connections_active{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}) / sum by (pod) (hikaricp_connections_max{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"})",
              "legendFormat": "{{ "{{pod}}" }} pool 사용률"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] }
            }
          }
        },
        {
          "id": 55,
          "title": "Hikari Average Acquire Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 94 },
          "datasource": { "uid": "prometheus" },
          "description": "hikaricp_connections_acquire_seconds_* — metric 없으면 No data",
          "targets": [
            {
              "expr": "rate(hikaricp_connections_acquire_seconds_sum{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}[5m]) / rate(hikaricp_connections_acquire_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-core\"}[5m])",
              "legendFormat": "{{ "{{pod}}" }} avg acquire time"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 4 } }
        },
        {
          "id": 60,
          "title": "HPA / Scheduling",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 102 },
          "panels": []
        },
        {
          "id": 61,
          "title": "HPA Replicas (Current / Desired / Max)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 103 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"{{ .Values.safespot.namespace.application }}\",horizontalpodautoscaler=~\".*api-core.*\"}",
              "legendFormat": "{{ "{{horizontalpodautoscaler}}" }} current"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"{{ .Values.safespot.namespace.application }}\",horizontalpodautoscaler=~\".*api-core.*\"}",
              "legendFormat": "{{ "{{horizontalpodautoscaler}}" }} desired"
            },
            {
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"{{ .Values.safespot.namespace.application }}\",horizontalpodautoscaler=~\".*api-core.*\"}",
              "legendFormat": "{{ "{{horizontalpodautoscaler}}" }} max"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 } }
        },
        {
          "id": 62,
          "title": "Pending Pods (application ns)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 103 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (namespace) (kube_pod_status_phase{namespace=\"{{ .Values.safespot.namespace.application }}\",phase=\"Pending\"})",
              "legendFormat": "pending pods"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 63,
          "title": "api-core Pods by Node",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 103 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "count by (node) (kube_pod_info{namespace=\"{{ .Values.safespot.namespace.application }}\",pod=~\"api-core.*\"})",
              "legendFormat": "node {{ "{{node}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 } }
        }
      ]
    }
{{- end }}
