{{- if .Values.safespot.dashboards.cloudwatchRaw.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cloudwatch
  namespace: {{ .Values.safespot.namespace.monitoring }}
  labels:
    grafana_dashboard: "1"
    env: {{ .Values.safespot.env }}
    region: {{ .Values.safespot.region }}
data:
  cloudwatch.json: |
    {
      "uid": "safespot-cloudwatch",
      "title": "SafeSpot — AWS Metrics via YACE (RDS / SQS / Lambda / ALB)",
      "tags": ["safespot", "cloudwatch", "yace", "prometheus", "aws", "infra"],
      "timezone": "Asia/Seoul",
      "refresh": "60s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 100,
          "title": "── RDS Aurora ──",
          "type": "text",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 },
          "options": { "mode": "markdown" }
        },
        {
          "id": 1,
          "title": "RDS CPU Utilization (%)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 1, "w": 8, "h": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_rds_cpuutilization_average",
              "legendFormat": "CPU %",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "id": 2,
          "title": "RDS DB Connections",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 1, "w": 8, "h": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_rds_database_connections_average",
              "legendFormat": "connections",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "RDS Read / Write Latency (ms)",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 1, "w": 8, "h": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_rds_read_latency_average * 1000",
              "legendFormat": "read latency",
              "refId": "A"
            },
            {
              "expr": "aws_rds_write_latency_average * 1000",
              "legendFormat": "write latency",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "id": 4,
          "title": "RDS Replica Lag (ms)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 7, "w": 12, "h": 5 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_rds_aurora_replica_lag_maximum",
              "legendFormat": "replica lag",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "id": 5,
          "title": "RDS Volume Bytes Used",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 7, "w": 12, "h": 5 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_rds_volume_bytes_used_average",
              "legendFormat": "volume bytes used",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 101,
          "title": "── SQS ──",
          "type": "text",
          "gridPos": { "x": 0, "y": 12, "w": 24, "h": 1 },
          "options": { "mode": "markdown" }
        },
        {
          "id": 6,
          "title": "SQS Visible Messages (Backlog)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 13, "w": 8, "h": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_sqs_approximate_number_of_messages_visible_maximum{name!~\".*[dD][lL][qQ].*\"}",
              "legendFormat": "{{`{{ name }}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "SQS Oldest Message Age (초)",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 13, "w": 8, "h": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_sqs_approximate_age_of_oldest_message_maximum{name!~\".*[dD][lL][qQ].*\"}",
              "legendFormat": "{{`{{ name }}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 8,
          "title": "SQS Sent / Deleted",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 13, "w": 8, "h": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_sqs_number_of_messages_sent_sum{name!~\".*[dD][lL][qQ].*\"}",
              "legendFormat": "sent - {{`{{ name }}`}}",
              "refId": "A"
            },
            {
              "expr": "aws_sqs_number_of_messages_deleted_sum{name!~\".*[dD][lL][qQ].*\"}",
              "legendFormat": "deleted - {{`{{ name }}`}}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 102,
          "title": "── DLQ ──",
          "type": "text",
          "gridPos": { "x": 0, "y": 19, "w": 24, "h": 1 },
          "options": { "mode": "markdown" }
        },
        {
          "id": 9,
          "title": "DLQ Visible Messages",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 20, "w": 12, "h": 5 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_sqs_approximate_number_of_messages_visible_maximum{name=~\".*cache.*refresh.*dlq.*|.*cache.*refresh.*DLQ.*|.*cache-refresh-dlq.*\"}",
              "legendFormat": "cache-refresh-dlq",
              "refId": "A"
            },
            {
              "expr": "aws_sqs_approximate_number_of_messages_visible_maximum{name=~\".*readmodel.*refresh.*dlq.*|.*readmodel.*refresh.*DLQ.*|.*readmodel-refresh-dlq.*\"}",
              "legendFormat": "readmodel-refresh-dlq",
              "refId": "B"
            },
            {
              "expr": "aws_sqs_approximate_number_of_messages_visible_maximum{name=~\".*environment.*cache.*refresh.*dlq.*|.*environment.*cache.*refresh.*DLQ.*|.*environment-cache-refresh-dlq.*\"}",
              "legendFormat": "environment-cache-refresh-dlq",
              "refId": "C"
            }
          ]
        },
        {
          "id": 10,
          "title": "DLQ Oldest Message Age (초)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 20, "w": 12, "h": 5 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_sqs_approximate_age_of_oldest_message_maximum{name=~\".*cache.*refresh.*dlq.*|.*cache.*refresh.*DLQ.*|.*cache-refresh-dlq.*\"}",
              "legendFormat": "cache-refresh-dlq",
              "refId": "A"
            },
            {
              "expr": "aws_sqs_approximate_age_of_oldest_message_maximum{name=~\".*readmodel.*refresh.*dlq.*|.*readmodel.*refresh.*DLQ.*|.*readmodel-refresh-dlq.*\"}",
              "legendFormat": "readmodel-refresh-dlq",
              "refId": "B"
            },
            {
              "expr": "aws_sqs_approximate_age_of_oldest_message_maximum{name=~\".*environment.*cache.*refresh.*dlq.*|.*environment.*cache.*refresh.*DLQ.*|.*environment-cache-refresh-dlq.*\"}",
              "legendFormat": "environment-cache-refresh-dlq",
              "refId": "C"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 103,
          "title": "── Lambda ──",
          "type": "text",
          "gridPos": { "x": 0, "y": 25, "w": 24, "h": 1 },
          "options": { "mode": "markdown" }
        },
        {
          "id": 11,
          "title": "Lambda Invocations / Errors / Throttles",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 26, "w": 12, "h": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_lambda_invocations_sum",
              "legendFormat": "invocations - {{`{{ name }}`}}",
              "refId": "A"
            },
            {
              "expr": "aws_lambda_errors_sum",
              "legendFormat": "errors - {{`{{ name }}`}}",
              "refId": "B"
            },
            {
              "expr": "aws_lambda_throttles_sum",
              "legendFormat": "throttles - {{`{{ name }}`}}",
              "refId": "C"
            }
          ]
        },
        {
          "id": 12,
          "title": "Lambda Duration Average / Max (ms)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 26, "w": 12, "h": 6 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_lambda_duration_average",
              "legendFormat": "avg duration - {{`{{ name }}`}}",
              "refId": "A"
            },
            {
              "expr": "aws_lambda_duration_maximum",
              "legendFormat": "max duration - {{`{{ name }}`}}",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "id": 13,
          "title": "Lambda ConcurrentExecutions",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 32, "w": 12, "h": 5 },
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "aws_lambda_concurrent_executions_maximum",
              "legendFormat": "concurrent - {{`{{ name }}`}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 104,
          "title": "── ALB (Application Load Balancer) ──",
          "type": "text",
          "gridPos": { "x": 0, "y": 37, "w": 24, "h": 1 },
          "options": { "mode": "markdown" },
          "description": "YACE metric prefix: aws_applicationelb_*  |  Explore: {__name__=~\"aws_applicationelb_.*\"}"
        },
        {
          "id": 14,
          "title": "ALB Request TPS",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 38, "w": 12, "h": 6 },
          "datasource": "Prometheus",
          "description": "ALB가 수신한 초당 요청 수. rate(RequestCount Sum[1m]). 메트릭 이름: aws_applicationelb_request_count_sum",
          "targets": [
            {
              "expr": "rate(aws_applicationelb_request_count_sum[1m])",
              "legendFormat": "ALB TPS {{`{{ dimension_LoadBalancer }}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 15,
          "title": "ALB TargetResponseTime (avg / max)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 38, "w": 12, "h": 6 },
          "datasource": "Prometheus",
          "description": "ALB → Target 간 응답 시간. 메트릭: aws_applicationelb_target_response_time_average / _maximum",
          "targets": [
            {
              "expr": "aws_applicationelb_target_response_time_average",
              "legendFormat": "avg {{`{{ dimension_LoadBalancer }}`}}",
              "refId": "A"
            },
            {
              "expr": "aws_applicationelb_target_response_time_maximum",
              "legendFormat": "max {{`{{ dimension_LoadBalancer }}`}}",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 16,
          "title": "ALB 4xx / 5xx (ELB 레벨)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 44, "w": 12, "h": 6 },
          "datasource": "Prometheus",
          "description": "ALB 자체가 반환한 4xx/5xx. 메트릭: aws_applicationelb_httpcode_elb_4_xx_count_sum / _5_xx_count_sum",
          "targets": [
            {
              "expr": "rate(aws_applicationelb_httpcode_elb_4_xx_count_sum[1m])",
              "legendFormat": "ELB 4xx",
              "refId": "A"
            },
            {
              "expr": "rate(aws_applicationelb_httpcode_elb_5_xx_count_sum[1m])",
              "legendFormat": "ELB 5xx",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 17,
          "title": "Target 2xx / 4xx / 5xx (Target Group 레벨)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 44, "w": 12, "h": 6 },
          "datasource": "Prometheus",
          "description": "Target Group 이 반환한 HTTP 상태 코드. 메트릭: aws_applicationelb_httpcode_target_{2|4|5}xx_count_sum",
          "targets": [
            {
              "expr": "rate(aws_applicationelb_httpcode_target_2_xx_count_sum[1m])",
              "legendFormat": "Target 2xx {{`{{ dimension_TargetGroup }}`}}",
              "refId": "A"
            },
            {
              "expr": "rate(aws_applicationelb_httpcode_target_4_xx_count_sum[1m])",
              "legendFormat": "Target 4xx {{`{{ dimension_TargetGroup }}`}}",
              "refId": "B"
            },
            {
              "expr": "rate(aws_applicationelb_httpcode_target_5_xx_count_sum[1m])",
              "legendFormat": "Target 5xx {{`{{ dimension_TargetGroup }}`}}",
              "refId": "C"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 18,
          "title": "ALB Rejected / TargetConnectionError",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 50, "w": 12, "h": 6 },
          "datasource": "Prometheus",
          "description": "거절된 연결 수 + Target 연결 오류 수. ALB 수용 한계 또는 Target 연결 불안정 시 급등.",
          "targets": [
            {
              "expr": "rate(aws_applicationelb_rejected_connection_count_sum[1m])",
              "legendFormat": "Rejected connections/s",
              "refId": "A"
            },
            {
              "expr": "rate(aws_applicationelb_target_connection_error_count_sum[1m])",
              "legendFormat": "Target connection errors/s {{`{{ dimension_TargetGroup }}`}}",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 19,
          "title": "ALB Active / New Connections",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 50, "w": 12, "h": 6 },
          "datasource": "Prometheus",
          "description": "동시 활성 연결 수 및 신규 연결 수. 메트릭: aws_applicationelb_active_connection_count_sum / _new_connection_count_sum",
          "targets": [
            {
              "expr": "aws_applicationelb_active_connection_count_sum",
              "legendFormat": "Active connections",
              "refId": "A"
            },
            {
              "expr": "aws_applicationelb_new_connection_count_sum",
              "legendFormat": "New connections",
              "refId": "B"
            }
          ]
        }
      ]
    }
{{- end }}