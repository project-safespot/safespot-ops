{{- if .Values.safespot.dashboards.apiCustom.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-api-public-read
  namespace: {{ .Values.safespot.namespace.monitoring }}
  labels:
    grafana_dashboard: "1"
    env: {{ .Values.safespot.env }}
    region: {{ .Values.safespot.region }}
data:
  api-public-read.json: |
    {
      "uid": "safespot-api-public-read",
      "title": "SafeSpot — api-public-read",
      "tags": ["safespot", "api-public-read", "redis"],
      "timezone": "Asia/Seoul",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "HTTP Metrics",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 2,
          "title": "TPS by URI (actuator 제외)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (uri) (rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",uri!~\"/actuator.*|UNKNOWN\"}[1m]))",
              "legendFormat": "{{ "{{uri}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 3,
          "title": "Latency p50 / p95 / p99 (actuator 제외)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",uri!~\"/actuator.*|UNKNOWN\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",uri!~\"/actuator.*|UNKNOWN\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",uri!~\"/actuator.*|UNKNOWN\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3 } }
        },
        {
          "id": 4,
          "title": "4xx Error Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >1% for 5m",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",status=~\"4..\",uri!~\"/actuator.*|UNKNOWN\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",uri!~\"/actuator.*|UNKNOWN\"}[5m]))",
              "legendFormat": "4xx rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }
            }
          }
        },
        {
          "id": 5,
          "title": "5xx Error Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >1% for 5m",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",status=~\"5..\",uri!~\"/actuator.*|UNKNOWN\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",uri!~\"/actuator.*|UNKNOWN\"}[5m]))",
              "legendFormat": "5xx rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }
            }
          }
        },
        {
          "id": 15,
          "title": "Redis Cache / Fallback",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "panels": []
        },
        {
          "id": 16,
          "title": "Cache Hit / Miss / ParseError by Cache",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "datasource": { "uid": "prometheus" },
          "description": "metric: safespot_cache_requests_total | cache: disaster_messages / disaster_detail / shelter_status / weather / air_quality",
          "targets": [
            {
              "expr": "sum by (cache) (rate(safespot_cache_requests_total{service=\"api-public-read\",result=\"hit\"}[1m]))",
              "legendFormat": "hit — {{ "{{cache}}" }}"
            },
            {
              "expr": "sum by (cache) (rate(safespot_cache_requests_total{service=\"api-public-read\",result=\"miss\"}[1m]))",
              "legendFormat": "miss — {{ "{{cache}}" }}"
            },
            {
              "expr": "sum by (cache) (rate(safespot_cache_requests_total{service=\"api-public-read\",result=\"parse_error\"}[1m]))",
              "legendFormat": "parse_error — {{ "{{cache}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 17,
          "title": "Cache Hit Rate (Warning <90%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "datasource": { "uid": "prometheus" },
          "description": "전체 hit rate + cache별 hit rate | metric: safespot_cache_requests_total | 기동 직후 No data일 수 있음",
          "targets": [
            {
              "expr": "sum(rate(safespot_cache_requests_total{service=\"api-public-read\",result=\"hit\"}[5m])) / sum(rate(safespot_cache_requests_total{service=\"api-public-read\",result=~\"hit|miss|parse_error\"}[5m]))",
              "legendFormat": "overall hit rate"
            },
            {
              "expr": "sum by (cache) (rate(safespot_cache_requests_total{service=\"api-public-read\",result=\"hit\"}[5m])) / sum by (cache) (rate(safespot_cache_requests_total{service=\"api-public-read\",result=~\"hit|miss|parse_error\"}[5m]))",
              "legendFormat": "{{ "{{cache}}" }} hit rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "green", "value": 0.9 }] }
            }
          }
        },
        {
          "id": 18,
          "title": "Redis Fallback by Cache & Reason",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 26 },
          "datasource": { "uid": "prometheus" },
          "description": "metric: safespot_cache_fallback_total | reason: redis_error / timeout / …",
          "targets": [
            {
              "expr": "sum by (cache, reason) (rate(safespot_cache_fallback_total{service=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{cache}}" }} — {{ "{{reason}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 19,
          "title": "Redis Fallback Rate vs Requests (Warning >1%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 26 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >1% | safespot_cache_fallback_total / http_server_requests",
          "targets": [
            {
              "expr": "sum(rate(safespot_cache_fallback_total{service=\"api-public-read\"}[5m])) / sum(rate(http_server_requests_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",uri!~\"/actuator.*|UNKNOWN\"}[5m]))",
              "legendFormat": "redis fallback rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] }
            }
          }
        },
        {
          "id": 20,
          "title": "DB Fallback Query Count by Repository & Reason",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 34 },
          "datasource": { "uid": "prometheus" },
          "description": "metric: safespot_db_fallback_queries_total | repository: disaster_alert / shelter_status / weather_log / air_quality_log",
          "targets": [
            {
              "expr": "sum by (repository, reason) (rate(safespot_db_fallback_queries_total{service=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{repository}}" }} — {{ "{{reason}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 21,
          "title": "Redis Read Average Latency by Cache",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 34 },
          "datasource": { "uid": "prometheus" },
          "description": "metric: safespot_redis_read_seconds_* | hit/miss 포함 전체 Redis 읽기 지연",
          "targets": [
            {
              "expr": "sum by (cache) (rate(safespot_redis_read_seconds_sum{service=\"api-public-read\"}[5m])) / sum by (cache) (rate(safespot_redis_read_seconds_count{service=\"api-public-read\"}[5m]))",
              "legendFormat": "{{ "{{cache}}" }} avg read latency"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 4 } }
        },
        {
          "id": 22,
          "title": "DB Fallback Average Latency by Repository",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 42 },
          "datasource": { "uid": "prometheus" },
          "description": "metric: safespot_db_fallback_seconds_* | fallback 발생 시 DB 쿼리 지연",
          "targets": [
            {
              "expr": "sum by (repository) (rate(safespot_db_fallback_seconds_sum{service=\"api-public-read\"}[5m])) / sum by (repository) (rate(safespot_db_fallback_seconds_count{service=\"api-public-read\"}[5m]))",
              "legendFormat": "{{ "{{repository}}" }} avg fallback latency"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 4 } }
        },
        {
          "id": 23,
          "title": "Cache Regeneration Requested by Cache & Reason",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 42 },
          "datasource": { "uid": "prometheus" },
          "description": "metric: safespot_cache_regeneration_requested_total | cache miss / stale 등으로 재생성 요청된 횟수",
          "targets": [
            {
              "expr": "sum by (cache, reason, result) (rate(safespot_cache_regeneration_requested_total{service=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{cache}}" }} {{ "{{reason}}" }} → {{ "{{result}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 24,
          "title": "Fallback Single-Flight",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 50 },
          "description": "Leader는 실제 DB fallback을 수행한 요청입니다. Join은 동일 key에 대해 leader 결과를 기다린 follower 요청입니다. Suppressed는 single-flight join으로 DB fallback이 억제된 요청입니다. Suppression Ratio는 join / (leader + join)입니다. single-flight는 DB fallback 폭주를 줄이지만 cold miss latency 자체를 제거하지는 않습니다. stale serve는 아직 별도 후속 과제입니다.",
          "panels": []
        },
        {
          "id": 90,
          "title": "Single-flight Leader Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 51 },
          "datasource": { "uid": "prometheus" },
          "description": "Leader는 실제 DB fallback을 수행한 요청입니다.",
          "targets": [
            {
              "expr": "sum by (cache, repository) (rate(fallback_singleflight_leader_total{service=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{cache}}" }} / {{ "{{repository}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 91,
          "title": "Single-flight Join Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 51 },
          "datasource": { "uid": "prometheus" },
          "description": "Join은 동일 key에 대해 leader 결과를 기다린 follower 요청입니다.",
          "targets": [
            {
              "expr": "sum by (cache, repository) (rate(fallback_singleflight_join_total{service=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{cache}}" }} / {{ "{{repository}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 92,
          "title": "Fallback Suppressed Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 51 },
          "datasource": { "uid": "prometheus" },
          "description": "Suppressed는 single-flight join으로 DB fallback이 억제된 요청입니다.",
          "targets": [
            {
              "expr": "sum by (cache, repository) (rate(fallback_suppressed_total{service=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{cache}}" }} / {{ "{{repository}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 93,
          "title": "Single-flight Suppression Ratio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 59 },
          "datasource": { "uid": "prometheus" },
          "description": "Suppression Ratio = join / (leader + join). single-flight는 DB fallback 폭주를 줄이지만 cold miss latency 자체를 제거하지는 않습니다.",
          "targets": [
            {
              "expr": "sum by (cache, repository) (rate(fallback_singleflight_join_total{service=\"api-public-read\"}[1m])) / (sum by (cache, repository) (rate(fallback_singleflight_join_total{service=\"api-public-read\"}[1m])) + sum by (cache, repository) (rate(fallback_singleflight_leader_total{service=\"api-public-read\"}[1m])))",
              "legendFormat": "{{ "{{cache}}" }} / {{ "{{repository}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } }
        },
        {
          "id": 94,
          "title": "Single-flight Timeout Rate Optional",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 59 },
          "datasource": { "uid": "prometheus" },
          "description": "No data이면 timeout이 발생하지 않았거나 timeout metric series가 아직 생성되지 않은 상태일 수 있습니다.",
          "targets": [
            {
              "expr": "sum by (cache, repository) (rate(fallback_singleflight_timeout_total{service=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{cache}}" }} / {{ "{{repository}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 95,
          "title": "DB Fallback Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 59 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (repository, reason) (rate(safespot_db_fallback_queries_total{service=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{repository}}" }} / {{ "{{reason}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 96,
          "title": "Hikari Pending",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 67 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod, service) (hikaricp_connections_pending{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} / {{ "{{service}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 97,
          "title": "HTTP p99 by URI",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 67 },
          "datasource": { "uid": "prometheus" },
          "description": "cold miss latency 자체는 single-flight로 제거되지 않으므로 p99와 함께 봅니다.",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (uri, le) (rate(http_server_requests_seconds_bucket{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"}[5m])))",
              "legendFormat": "{{ "{{uri}}" }} p99"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3 } }
        },
        {
          "id": 25,
          "title": "JVM Heap",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 75 },
          "panels": []
        },
        {
          "id": 26,
          "title": "Heap Total Usage % (Warning >80%, Critical >90%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 76 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >80% for 5m | Critical: >90% for 5m",
          "targets": [
            {
              "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",area=\"heap\"}) / sum by (pod) (jvm_memory_max_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",area=\"heap\"})",
              "legendFormat": "{{ "{{pod}}" }} heap 사용률"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.8 }, { "color": "red", "value": 0.9 }] }
            }
          }
        },
        {
          "id": 27,
          "title": "Heap by Pool: Eden / Survivor — bytes (used)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 76 },
          "datasource": { "uid": "prometheus" },
          "description": "Eden/Survivor는 JVM에 따라 max가 부정확하므로 used bytes 절대값으로 표시. Old Gen은 우측 패널 참조.",
          "targets": [
            {
              "expr": "sum by (pod, id) (jvm_memory_used_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",area=\"heap\",id!~\".*[Oo]ld.*\"})",
              "legendFormat": "{{ "{{pod}}" }} / {{ "{{id}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 28,
          "title": "Old Gen Usage % (Warning >70%, Critical >85%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 76 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >70% for 5m | Critical: >85% for 5m — Full GC 전조",
          "targets": [
            {
              "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",area=\"heap\",id=~\".*[Oo]ld.*\"}) / sum by (pod) (jvm_memory_max_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",area=\"heap\",id=~\".*[Oo]ld.*\"})",
              "legendFormat": "{{ "{{pod}}" }} Old Gen"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.85 }] }
            }
          }
        },
        {
          "id": 29,
          "title": "GC Pause Time Ratio (Warning >5%, Critical >10%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 84 },
          "datasource": { "uid": "prometheus" },
          "description": "초당 GC 소비 시간 비율. 0.05=5%(warning), 0.10=10%(critical) | GC pause 미발생 시 No data",
          "targets": [
            {
              "expr": "sum by (pod) (rate(jvm_gc_pause_seconds_sum{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{pod}}" }} GC time ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.05 }, { "color": "red", "value": 0.1 }] }
            }
          }
        },
        {
          "id": 30,
          "title": "Average GC Pause (Warning >200ms, Critical >1s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 84 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >200ms | Critical: >1s | GC pause 미발생 시 No data",
          "targets": [
            {
              "expr": "sum by (pod) (rate(jvm_gc_pause_seconds_sum{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"}[5m])) / sum by (pod) (rate(jvm_gc_pause_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"}[5m]))",
              "legendFormat": "{{ "{{pod}}" }} avg pause"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.2 }, { "color": "red", "value": 1.0 }] }
            }
          }
        },
        {
          "id": 31,
          "title": "Non-Heap Usage (Metaspace / CodeCache 등)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 84 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod, id) (jvm_memory_used_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\",area=\"nonheap\"})",
              "legendFormat": "{{ "{{pod}}" }} / {{ "{{id}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 32,
          "title": "GC Pause Count",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 92 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (rate(jvm_gc_pause_seconds_count{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{pod}}" }} count"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" } }
        },
        {
          "id": 33,
          "title": "Max GC Pause",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 92 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "max by (pod, action, cause) (jvm_gc_pause_seconds_max{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} {{ "{{action}}" }} ({{ "{{cause}}" }})"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3 } }
        },
        {
          "id": 40,
          "title": "Container / CPU",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 100 },
          "panels": []
        },
        {
          "id": 41,
          "title": "Container Memory Working Set",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 101 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod, container) (container_memory_working_set_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",container=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} working set"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 42,
          "title": "Memory Limit Usage % (Warning >85%, Critical >95%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 101 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >85% | Critical: >95%",
          "targets": [
            {
              "expr": "sum by (pod, container) (container_memory_working_set_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",container=\"api-public-read\"}) / sum by (pod, container) (kube_pod_container_resource_limits{namespace=\"{{ .Values.safespot.namespace.application }}\",container=\"api-public-read\",resource=\"memory\"})",
              "legendFormat": "{{ "{{pod}}" }} mem limit %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.85 }, { "color": "red", "value": 0.95 }] }
            }
          }
        },
        {
          "id": 43,
          "title": "JVM vs Container Memory Gap (off-heap 추정)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 101 },
          "datasource": { "uid": "prometheus" },
          "description": "container working_set - JVM total used = native/off-heap/direct buffer 추정값",
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",container=\"api-public-read\"}) - sum by (pod) (jvm_memory_used_bytes{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} off-heap gap"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 44,
          "title": "CPU Usage by Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 109 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"{{ .Values.safespot.namespace.application }}\",container=\"api-public-read\"}[1m]))",
              "legendFormat": "{{ "{{pod}}" }} cpu"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "cores", "decimals": 3 } }
        },
        {
          "id": 45,
          "title": "CPU Throttling Ratio (Warning >20%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 109 },
          "datasource": { "uid": "prometheus" },
          "description": "Warning: >20% throttled",
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"{{ .Values.safespot.namespace.application }}\",pod=~\"api-public-read.*|api-public-read-surge.*\",container!=\"\",image!=\"\"}[1m])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"{{ .Values.safespot.namespace.application }}\",pod=~\"api-public-read.*|api-public-read-surge.*\",container!=\"\",image!=\"\"}[1m]))",
              "legendFormat": "{{ "{{pod}}" }} throttle ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.2 }] }
            }
          }
        },
        {
          "id": 50,
          "title": "JVM Threads / Optional Tomcat Debug",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 117 },
          "panels": []
        },
        {
          "id": 51,
          "title": "JVM Live Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 118 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "jvm_threads_live_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"}",
              "legendFormat": "{{ "{{pod}}" }} live threads"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 52,
          "title": "JVM Peak Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 118 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "jvm_threads_peak_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"}",
              "legendFormat": "{{ "{{pod}}" }} peak threads"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 53,
          "title": "Optional Debug - Tomcat Busy Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 118 },
          "datasource": { "uid": "prometheus" },
          "description": "tomcat_threads_* is not currently exposed by api-public-read actuator. No data is expected unless the application starts exposing these metrics.",
          "targets": [
            {
              "expr": "sum by (pod) (tomcat_threads_busy_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} tomcat busy"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 54,
          "title": "Optional Debug - Tomcat Busy Ratio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 118 },
          "datasource": { "uid": "prometheus" },
          "description": "tomcat_threads_* is not currently exposed by api-public-read actuator. No data is expected unless the application starts exposing these metrics.",
          "targets": [
            {
              "expr": "sum by (pod) (tomcat_threads_busy_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"}) / sum by (pod) (tomcat_threads_config_max_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} busy ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            }
          }
        },
        {
          "id": 60,
          "title": "Optional Debug - Tomcat Current Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 126 },
          "datasource": { "uid": "prometheus" },
          "description": "tomcat_threads_* is not currently exposed by api-public-read actuator. No data is expected unless the application starts exposing these metrics.",
          "targets": [
            {
              "expr": "sum by (pod) (tomcat_threads_current_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} tomcat current"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 55,
          "title": "Optional Debug - Tomcat Max Threads",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 126 },
          "datasource": { "uid": "prometheus" },
          "description": "tomcat_threads_* is not currently exposed by api-public-read actuator. No data is expected unless the application starts exposing these metrics.",
          "targets": [
            {
              "expr": "sum by (pod) (tomcat_threads_config_max_threads{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} tomcat max"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 70,
          "title": "Hikari DB Connection Pool",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 134 },
          "panels": []
        },
        {
          "id": 71,
          "title": "Hikari Pending Connections (Critical >0)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 135 },
