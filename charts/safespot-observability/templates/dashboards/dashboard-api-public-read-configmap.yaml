          }
        },
        {
          "id": 72,
          "title": "Hikari Active Connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 135 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (hikaricp_connections_active{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} active"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 73,
          "title": "Hikari Max Connections",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 135 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (hikaricp_connections_max{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} max"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 74,
          "title": "Hikari Pool Usage %",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 135 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (pod) (hikaricp_connections_active{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"}) / sum by (pod) (hikaricp_connections_max{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} pool usage"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] }
            }
          }
        },
        {
          "id": 75,
          "title": "HPA / Scheduling",
          "type": "row",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 143 },
          "panels": []
        },
        {
          "id": 76,
          "title": "HPA Replicas (Current / Desired / Max)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 144 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"{{ .Values.safespot.namespace.application }}\",horizontalpodautoscaler=~\".*api-public-read.*\"}",
              "legendFormat": "{{ "{{horizontalpodautoscaler}}" }} current"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"{{ .Values.safespot.namespace.application }}\",horizontalpodautoscaler=~\".*api-public-read.*\"}",
              "legendFormat": "{{ "{{horizontalpodautoscaler}}" }} desired"
            },
            {
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"{{ .Values.safespot.namespace.application }}\",horizontalpodautoscaler=~\".*api-public-read.*\"}",
              "legendFormat": "{{ "{{horizontalpodautoscaler}}" }} max"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 } }
        },
        {
          "id": 77,
          "title": "Pending Pods (application ns)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 144 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (namespace) (kube_pod_status_phase{namespace=\"{{ .Values.safespot.namespace.application }}\",phase=\"Pending\"})",
              "legendFormat": "pending pods"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 78,
          "title": "api-public-read Pods by Node",
          "type": "stat",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 144 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            {
              "expr": "count by (node) (kube_pod_info{namespace=\"{{ .Values.safespot.namespace.application }}\",pod=~\"api-public-read.*\"})",
              "legendFormat": "node {{ "{{node}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 } }
        }
      ]
    }
