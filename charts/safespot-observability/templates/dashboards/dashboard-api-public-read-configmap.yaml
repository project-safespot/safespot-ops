          "targets": [
            {
              "expr": "sum by (pod) (hikaricp_connections_pending{namespace=\"{{ .Values.safespot.namespace.application }}\",service=\"api-public-read\"})",
              "legendFormat": "{{ "{{pod}}" }} pending"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] }
