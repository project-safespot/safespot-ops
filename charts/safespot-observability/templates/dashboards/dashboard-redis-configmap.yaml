{{- if .Values.safespot.dashboards.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-redis
  namespace: {{ .Values.safespot.namespace.monitoring }}
  labels:
    grafana_dashboard: "1"
    env: {{ .Values.safespot.env }}
    region: {{ .Values.safespot.region }}
data:
  redis.json: |
    {
      "uid": "safespot-redis",
      "title": "SafeSpot — Redis Infrastructure",
      "tags": ["safespot", "redis", "infra"],
      "timezone": "Asia/Seoul",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Redis Up",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "datasource": { "uid": "prometheus" },
          "targets": [{ "expr": "redis_up", "legendFormat": "up" }],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Hit Ratio (5m)",
          "type": "gauge",
          "gridPos": { "x": 4, "y": 0, "w": 5, "h": 4 },
          "datasource": { "uid": "prometheus" },
          "targets": [{
            "expr": "rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))",
            "legendFormat": "hit ratio"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": { "steps": [
                { "value": 0, "color": "red" },
                { "value": 0.7, "color": "yellow" },
                { "value": 0.9, "color": "green" }
              ]}
            }
          }
        },
        {
          "id": 3,
          "title": "Memory Usage Ratio",
          "type": "gauge",
          "gridPos": { "x": 9, "y": 0, "w": 5, "h": 4 },
          "datasource": { "uid": "prometheus" },
          "targets": [{
            "expr": "(redis_memory_used_bytes / redis_memory_max_bytes) and redis_memory_max_bytes > 0",
            "legendFormat": "memory ratio"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": { "steps": [
                { "value": 0, "color": "green" },
                { "value": 0.7, "color": "yellow" },
                { "value": 0.85, "color": "red" }
              ]}
            }
          }
        },
        {
          "id": 4,
          "title": "Connected Clients",
          "type": "stat",
          "gridPos": { "x": 14, "y": 0, "w": 5, "h": 4 },
          "datasource": { "uid": "prometheus" },
          "targets": [{ "expr": "redis_connected_clients", "legendFormat": "clients" }]
        },
        {
          "id": 5,
          "title": "Blocked Clients",
          "type": "stat",
          "gridPos": { "x": 19, "y": 0, "w": 5, "h": 4 },
          "datasource": { "uid": "prometheus" },
          "targets": [{ "expr": "redis_blocked_clients", "legendFormat": "blocked" }],
          "fieldConfig": {
            "defaults": {
              "thresholds": { "steps": [
                { "value": 0, "color": "green" },
                { "value": 1, "color": "red" }
              ]}
            }
          }
        },
        {
          "id": 6,
          "title": "Hit / Miss 추이",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            { "expr": "rate(redis_keyspace_hits_total[1m])", "legendFormat": "hits/sec" },
            { "expr": "rate(redis_keyspace_misses_total[1m])", "legendFormat": "misses/sec" }
          ]
        },
        {
          "id": 7,
          "title": "Memory Used / Max (bytes)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            { "expr": "redis_memory_used_bytes", "legendFormat": "used" },
            { "expr": "redis_memory_max_bytes", "legendFormat": "max" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 8,
          "title": "Evicted / Expired Keys (rate)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 10, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            { "expr": "rate(redis_evicted_keys_total[1m])", "legendFormat": "evicted/sec" },
            { "expr": "rate(redis_expired_keys_total[1m])", "legendFormat": "expired/sec" }
          ]
        },
        {
          "id": 9,
          "title": "Rejected Connections (rate)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 10, "w": 12, "h": 6 },
          "datasource": { "uid": "prometheus" },
          "targets": [
            { "expr": "rate(redis_rejected_connections_total[1m])", "legendFormat": "rejected/sec" },
            { "expr": "redis_slowlog_length", "legendFormat": "slowlog length" }
          ]
        }
      ]
    }
{{- end }}
