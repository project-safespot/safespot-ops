apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-redis
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    env: dev
    region: ap-northeast-2
data:
  redis.json: |
    {{- `
    {
      "title": "SafeSpot - Redis",
      "uid": "safespot-redis",
      "tags": ["safespot", "redis"],
      "timezone": "Asia/Seoul",
      "schemaVersion": 36,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Hit Ratio",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))",
              "legendFormat": "hit ratio"
            }
          ]
        },
        {
          "id": 2,
          "title": "메모리 사용률",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "redis_memory_used_bytes / redis_memory_max_bytes",
              "legendFormat": "memory 사용률"
            }
          ]
        },
        {
          "id": 3,
          "title": "Connected Clients",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "redis_connected_clients",
              "legendFormat": "connected clients"
            }
          ]
        },
        {
          "id": 4,
          "title": "Evicted Keys",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "rate(redis_evicted_keys_total[5m])",
              "legendFormat": "evicted keys/s"
            }
          ]
        },
        {
          "id": 5,
          "title": "Replication Lag (Replica)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {
              "expr": "redis_replication_lag_seconds",
              "legendFormat": "{{ instance }}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Master 상태",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 16},
          "targets": [
            {
              "expr": "redis_up{role=\"master\"}",
              "legendFormat": "master up"
            }
          ]
        }
      ]
    }
    ` -}}
