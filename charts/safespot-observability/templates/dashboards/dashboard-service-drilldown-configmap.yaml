{{- if .Values.safespot.dashboards.serviceDrilldown.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-service-drilldown
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    env: dev
    region: ap-northeast-2
data:
  service-drilldown.json: |
    {{- `
    {
      "title": "SafeSpot - Service Drilldown",
      "uid": "safespot-service-drilldown",
      "tags": ["safespot", "service", "api", "drilldown"],
      "timezone": "Asia/Seoul",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(http_server_requests_seconds_count{namespace=\"application\"}, service)",
            "refresh": 2,
            "multi": false,
            "includeAll": false
          },
          {
            "name": "uri",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(http_server_requests_seconds_count{namespace=\"application\",service=\"$service\"}, uri)",
            "refresh": 2,
            "multi": true,
            "includeAll": true
          }
        ]
      },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Service / API Drilldown",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 2,
          "title": "RPS by URI",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "targets": [
            {
              "expr": "sum by (uri, method, status) (rate(http_server_requests_seconds_count{namespace=\"application\",service=\"$service\",uri=~\"$uri\"}[1m]))",
              "legendFormat": "{{method}} {{uri}} {{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "lineInterpolation": "linear", "fillOpacity": 10, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "id": 3,
          "title": "Latency p50 / p95 / p99 by URI",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (uri, le) (rate(http_server_requests_seconds_bucket{namespace=\"application\",service=\"$service\",uri=~\"$uri\"}[5m])))",
              "legendFormat": "{{uri}} p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (uri, le) (rate(http_server_requests_seconds_bucket{namespace=\"application\",service=\"$service\",uri=~\"$uri\"}[5m])))",
              "legendFormat": "{{uri}} p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (uri, le) (rate(http_server_requests_seconds_bucket{namespace=\"application\",service=\"$service\",uri=~\"$uri\"}[5m])))",
              "legendFormat": "{{uri}} p99",
              "refId": "C"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "drawStyle": "line", "lineInterpolation": "linear", "fillOpacity": 10, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "id": 4,
          "title": "Error RPS by URI",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "targets": [
            {
              "expr": "sum by (uri, status) (rate(http_server_requests_seconds_count{namespace=\"application\",service=\"$service\",uri=~\"$uri\",status=~\"4..|5..\"}[1m]))",
              "legendFormat": "{{uri}} {{status}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "lineInterpolation": "linear", "fillOpacity": 10, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "id": 5,
          "title": "Top Slow APIs p95",
          "type": "table",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "targets": [
            {
              "expr": "topk(10, histogram_quantile(0.95, sum by (uri, method, le) (rate(http_server_requests_seconds_bucket{namespace=\"application\",service=\"$service\"}[5m]))))",
              "legendFormat": "{{method}} {{uri}}",
              "format": "time_series",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3 }, "overrides": [] },
          "options": { "showHeader": true }
        },
        {
          "id": 6,
          "title": "JVM Memory Used",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 17 },
          "targets": [
            {
              "expr": "sum by (area, id) (jvm_memory_used_bytes{namespace=\"application\",service=\"$service\"})",
              "legendFormat": "{{area}} / {{id}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "drawStyle": "line", "lineInterpolation": "linear", "fillOpacity": 10, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        },
        {
          "id": 7,
          "title": "JVM GC Pause p95",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 17 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (action, cause, le) (rate(jvm_gc_pause_seconds_bucket{namespace=\"application\",service=\"$service\"}[5m])))",
              "legendFormat": "{{action}} / {{cause}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "drawStyle": "line", "lineInterpolation": "linear", "fillOpacity": 10, "showPoints": "never" } }, "overrides": [] },
          "options": { "legend": { "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi", "sort": "desc" } }
        }
      ]
    }
    ` | nindent 4 }}
{{- end }}