apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: safespot-application
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    env: dev
    region: ap-northeast-2
spec:
  groups:
    - name: safespot.application
      rules:
        # A-2: API latency p99
        - alert: HighApiLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket[1m])) by (le, service, uri)
            ) > 3
          for: 1m
          labels:
            severity: critical
            env: dev
          annotations:
            summary: "API latency p99 초과 ({{`{{ $labels.service }}`}} {{`{{ $labels.uri }}`}})"
            description: "p99 latency {{`{{ $value }}`}}s > 3s"

        # A-3: 5xx 에러율
        - alert: HighErrorRate
          expr: |
            (
              rate(http_server_requests_seconds_count{status=~"5.."}[1m])
              /
              rate(http_server_requests_seconds_count[1m])
            ) > 0.05
            and
            rate(http_server_requests_seconds_count[1m]) > 1
          for: 1m
          labels:
            severity: critical
            env: dev
          annotations:
            summary: "5xx 에러율 5% 초과 ({{`{{ $labels.service }}`}})"
            description: "에러율 {{`{{ $value | humanizePercentage }}`}}"

        # Redis fallback 증가
        - alert: RedisFallbackIncreasing
          expr: |
            rate(api_read_cache_fallback_total{reason=~"redis_miss|redis_down"}[5m]) > 0.1
          for: 2m
          labels:
            severity: warning
            env: dev
          annotations:
            summary: "Redis fallback 증가 ({{`{{ $labels.service }}`}})"
            description: "reason={{`{{ $labels.reason }}`}}, rate={{`{{ $value }}`}}"
