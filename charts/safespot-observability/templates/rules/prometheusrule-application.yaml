{{- if .Values.safespot.prometheusRules.apiCustom.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: safespot-api-custom
  namespace: {{ .Values.safespot.namespace.monitoring }}
  labels:
    release: kube-prometheus-stack
    env: {{ .Values.safespot.env }}
    region: {{ .Values.safespot.region }}
spec:
  groups:
    - name: safespot.api.custom
      rules:
        # 커스텀 메트릭 기반 rule (api_read_cache_*, api_read_db_fallback_* 등)
        # 배포 후 실제 Prometheus에서 메트릭 존재 여부 확인 후 활성화하세요.

        - alert: RedisFallbackIncreasing
          expr: |
            rate(api_read_cache_fallback_total{reason=~"redis_miss|redis_down"}[5m]) > 0.1
          for: 2m
          labels:
            severity: warning
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Redis fallback 증가 ({{ "{{$labels.service}}" }})"
            description: "reason={{ "{{$labels.reason}}" }}, rate={{ "{{$value}}" }}"

        - alert: CacheHitRatioLow
          expr: |
            (
              sum(rate(api_read_cache_request_total{service=~"api-public-read|api-public-read-surge", result="hit"}[5m]))
            /
              sum(rate(api_read_cache_request_total{service=~"api-public-read|api-public-read-surge"}[5m]))
            ) < 0.7
          for: 3m
          labels:
            severity: warning
            service: api-public-read-family
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Cache hit ratio 하락"
            description: "hit ratio = {{ "{{$value | printf \"%.2f\"}}" }}"

        - alert: RedisFallbackSpiking
          expr: |
            sum(rate(api_read_cache_fallback_total{
              service=~"api-public-read|api-public-read-surge",
              reason="redis_down"
            }[1m])) > 5
          for: 1m
          labels:
            severity: critical
            service: api-public-read-family
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Redis down으로 인한 DB fallback 급증"
            description: "redis_down fallback = {{ "{{$value | printf \"%.1f\"}}" }}/sec"
{{- end }}
