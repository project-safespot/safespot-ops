{{- if .Values.safespot.prometheusRules.eks.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: safespot-eks
  namespace: {{ .Values.safespot.namespace.monitoring }}
  labels:
    release: kube-prometheus-stack
    env: {{ .Values.safespot.env }}
    region: {{ .Values.safespot.region }}
spec:
  groups:
    - name: safespot.eks
      rules:
        - alert: PodRestartTooMany
          expr: |
            increase(kube_pod_container_status_restarts_total[10m]) > 5
          for: 1m
          labels:
            severity: critical
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Pod restart 10분 내 5회 초과 ({{ "{{$labels.pod}}" }})"
            description: "namespace={{ "{{$labels.namespace}}" }}, pod={{ "{{$labels.pod}}" }}"

        - alert: HpaMaxWithHighErrorRate
          expr: |
            (
              kube_horizontalpodautoscaler_status_current_replicas
              ==
              kube_horizontalpodautoscaler_spec_max_replicas
            )
            and
            (
              rate(http_server_requests_seconds_count{status=~"5.."}[5m])
              /
              rate(http_server_requests_seconds_count[5m])
            ) > 0.01
          for: 5m
          labels:
            severity: warning
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "HPA max 도달 + 5xx 에러율 1% 초과"
            description: "HPA={{ "{{$labels.horizontalpodautoscaler}}" }}"

        - alert: PodOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: critical
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "OOMKilled 발생 ({{ "{{$labels.pod}}" }})"
            description: "namespace={{ "{{$labels.namespace}}" }}, container={{ "{{$labels.container}}" }}"

        - alert: PodPendingTooLong
          expr: |
            kube_pod_status_phase{phase="Pending"} == 1
          for: 5m
          labels:
            severity: warning
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Pod Pending 5분 초과 ({{ "{{$labels.pod}}" }})"
            description: "namespace={{ "{{$labels.namespace}}" }}"
{{- end }}
