apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: safespot-redis
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    env: dev
    region: ap-northeast-2
spec:
  groups:
    - name: safespot.redis
      rules:
        # A-5: Hit ratio 급락
        - alert: RedisLowHitRatio
          expr: |
            redis_keyspace_hits_total
            / (redis_keyspace_hits_total + redis_keyspace_misses_total)
            < 0.8
          for: 5m
          labels:
            severity: warning
            env: dev
          annotations:
            summary: "Redis hit ratio 80% 미만"
            description: "hit ratio {{`{{ $value | humanizePercentage }}`}}"

        - alert: RedisVeryLowHitRatio
          expr: |
            redis_keyspace_hits_total
            / (redis_keyspace_hits_total + redis_keyspace_misses_total)
            < 0.6
          for: 5m
          labels:
            severity: critical
            env: dev
          annotations:
            summary: "Redis hit ratio 60% 미만 (Critical)"
            description: "hit ratio {{`{{ $value | humanizePercentage }}`}}"

        # A-6: Replication lag
        - alert: RedisReplicationLag
          expr: |
            avg_over_time(redis_replication_lag_seconds[3m]) > 5
          for: 1m
          labels:
            severity: critical
            env: dev
          annotations:
            summary: "Redis replication lag 5s 초과"
            description: "lag {{`{{ $value }}`}}s"

        # A-7: Master down
        - alert: RedisMasterDown
          expr: |
            redis_up{role="master"} == 0
          for: 1m
          labels:
            severity: critical
            env: dev
          annotations:
            summary: "Redis master 다운"
            description: "redis_up{role=master} == 0"

        # A-8: Memory 사용률
        - alert: RedisHighMemoryUsage
          expr: |
            redis_memory_used_bytes / redis_memory_max_bytes > 0.9
          for: 5m
          labels:
            severity: warning
            env: dev
          annotations:
            summary: "Redis memory 사용률 90% 초과"
            description: "사용률 {{`{{ $value | humanizePercentage }}`}}"

        # Evicted keys 증가
        - alert: RedisEvictedKeysIncreasing
          expr: |
            rate(redis_evicted_keys_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
            env: dev
          annotations:
            summary: "Redis evicted keys 증가"
            description: "eviction rate {{`{{ $value }}`}}/s"
