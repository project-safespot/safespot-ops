{{- if .Values.safespot.prometheusRules.redis.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: safespot-redis
  namespace: {{ .Values.safespot.namespace.monitoring }}
  labels:
    release: kube-prometheus-stack
    env: {{ .Values.safespot.env }}
    region: {{ .Values.safespot.region }}
spec:
  groups:
    - name: safespot.redis
      interval: 30s
      rules:

        - alert: RedisMemoryUsageHigh
          expr: |
            (redis_memory_used_bytes / redis_memory_max_bytes > {{ .Values.alerts.redis.memoryUsageMax }})
            and redis_memory_max_bytes > 0
          for: 2m
          labels:
            severity: warning
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Redis 메모리 사용량 높음"
            description: "usage = {{ "{{$value | humanizePercentage}}" }} (임계값: {{ .Values.alerts.redis.memoryUsageMax }})"

        - alert: RedisEvictionRateHigh
          expr: |
            rate(redis_evicted_keys_total[1m]) > {{ .Values.alerts.redis.evictionRateMax }}
          for: 2m
          labels:
            severity: warning
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Redis eviction rate 급증"
            description: |
              eviction = {{ "{{$value | printf \"%.1f\"}}" }}/sec

        - alert: RedisRejectedConnections
          expr: |
            rate(redis_rejected_connections_total[1m]) > 0
          for: 1m
          labels:
            severity: critical
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Redis rejected connections 발생"
            description: |
              {{ "{{$value | printf \"%.1f\"}}" }}/sec 연결 거부

        - alert: RedisBlockedClientsNonZero
          expr: |
            redis_blocked_clients > 0
          for: 2m
          labels:
            severity: warning
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Redis blocked clients 발생"
            description: "blocked clients = {{ "{{$value}}" }}"

        - alert: RedisHitRatioLow
          expr: |
            (
              rate(redis_keyspace_hits_total[5m])
            / (
              rate(redis_keyspace_hits_total[5m])
              + rate(redis_keyspace_misses_total[5m])
            )) < 0.7
          for: 5m
          labels:
            severity: warning
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Redis hit ratio 하락"
            description: "hit ratio = {{ "{{$value | humanizePercentage}}" }}"

        - alert: RedisDown
          expr: |
            redis_up == 0
          for: 1m
          labels:
            severity: critical
            env: {{ .Values.safespot.env }}
          annotations:
            summary: "Redis 연결 불가"
            description: "redis_up == 0"
{{- end }}
