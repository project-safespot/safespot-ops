# ============================================================
# values-aws-prod.yaml
# AWS EKS prod 환경
# dev 대비 변경: 리소스 증설 / 보존 기간 연장 / 보안 강화
# ============================================================

safespot:
  env: prod
  region: ap-northeast-2

kube-prometheus-stack:

  grafana:
    adminPassword: ""   # 반드시 K8s Secret 참조로 처리 — 평문 금지
    # existingSecret: grafana-admin-secret-prod

    service:
      type: ClusterIP

    # Grafana → CloudWatch API 접근용 IRSA
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/safespot-prod-ops-grafana-cloudwatch"

    additionalDataSources:
      - name: Prometheus
        type: prometheus
        url: http://safespot-observability-kube-prometheus-stack-prometheus:9090
        isDefault: true
        access: proxy
        jsonData:
          timeInterval: "30s"

      # ── CloudWatch Datasource ──────────────────────────────
      # 메트릭: RDS, SQS, Lambda, ALB, NAT GW (ap-northeast-2)
      #         CloudFront, WAF (us-east-1)
      # 로그:   /safespot/prod/eks/fluent-bit
      #         /safespot/prod/rds/slow-query
      #         /safespot/prod/alb/access-log
      #         /safespot/prod/waf
      #         /safespot/prod/vpc/flow-log
      # 인증:   Grafana ServiceAccount IRSA (위 annotations ARN)
      - name: CloudWatch
        type: cloudwatch
        access: proxy
        jsonData:
          authType: default
          defaultRegion: ap-northeast-2
        isDefault: false

    # prod: Grafana 익명 접근 완전 차단
    grafana.ini:
      auth.anonymous:
        enabled: false
      security:
        allow_embedding: false

  prometheus:
    service:
      type: ClusterIP

    prometheusSpec:
      retention: 30d         # prod는 보존 기간 연장
      retentionSize: "50GB"

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp2
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 100Gi

      resources:
        requests:
          memory: 4Gi
          cpu: 1000m
        limits:
          memory: 8Gi
          cpu: 2000m

      # prod: 고가용성 — replica 2
      replicas: 2

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: gp2
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

      # prod: 고가용성
      replicas: 2

# ── redis-exporter ───────────────────────────────────────────
redis-exporter:
  enabled: true

  redisAddress: "redis://PROD_ELASTICACHE_PRIMARY_ENDPOINT:6379"

  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# ── ❌ cloudwatch-exporter 제거 ───────────────────────────────
# AWS 메트릭 알람 → CloudWatch Alarms (Terraform ops 모듈)
# Grafana 시각화 → CloudWatch Datasource (위 additionalDataSources)