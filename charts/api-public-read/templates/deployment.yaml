apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-public-read
    release: {{ .Release.Name }}
    version: {{ .Values.image.tag | quote }}
  # -----------------------------------------------------------------------
  # sync-wave: 2
  # ConfigMap(wave -1) → Service(wave 1) 생성 완료 후 Pod 생성
  # -----------------------------------------------------------------------
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWave.deployment | quote }}

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-public-read
      release: {{ .Release.Name }}

  # -----------------------------------------------------------------------
  # RollingUpdate: 무중단 배포
  #   maxUnavailable: 0 → 배포 중 항상 최소 replicaCount 유지
  #   maxSurge: 1       → 한 번에 1개씩 새 Pod 추가
  # -----------------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: api-public-read
        release: {{ .Release.Name }}
        version: {{ .Values.image.tag | quote }}

    spec:
      # -----------------------------------------------------------------------
      # Init Container: Redis + RDS 연결 대기
      #
      # api-public-read 동작 우선순위:
      #   1. Redis hit  → 즉시 반환
      #   2. Redis miss → CacheRegenerationRequested publish
      #   3. Redis down → RDS degraded-mode fallback (임시)
      #
      # Redis 는 miss 시 fallback 있으므로 엄격한 대기보다 연결 가능 여부만 확인
      # RDS 는 degraded-mode fallback 대상 → 연결 가능 여부 확인
      # -----------------------------------------------------------------------
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z "${REDIS_HOST}" "${REDIS_PORT}"; do
                echo "Redis 준비 대기 중..."
                sleep 5
              done
              echo "Redis 연결 확인 완료"
          env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.name }}
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.name }}
                  key: REDIS_PORT

        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z "${DB_HOST}" 5432; do
                echo "RDS 준비 대기 중..."
                sleep 5
              done
              echo "RDS 연결 확인 완료"
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.name }}
                  key: DB_HOST

      containers:
        - name: api-public-read
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          # -----------------------------------------------------------------------
          # 환경변수 주입
          # 1. Secret: REDIS_HOST, REDIS_PORT, DB_HOST, DB_PASSWORD, SQS_QUEUE_URL
          # 2. ConfigMap: SPRING_PROFILES_ACTIVE, SERVICE_REGION 등 비민감 설정
          # -----------------------------------------------------------------------
          envFrom:
            - secretRef:
                name: {{ .Values.secretRef.name }}
            - configMapRef:
                name: {{ .Release.Name }}-config

          # -----------------------------------------------------------------------
          # readinessProbe: Redis / RDS fallback 연결 상태 포함
          #   → 연결 실패 시 Service 트래픽에서 제외
          #   → failureThreshold 6 = 60초 유예 (Spring Boot 기동 대기)
          #
          # livenessProbe: 프로세스 생존 여부만
          #   → Redis 일시 장애로 Pod 재시작되는 것 방지
          # -----------------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}

          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}