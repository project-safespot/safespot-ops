apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-safespot
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    {{- include "safespot-ops.labels" . | nindent 4 }}
    {{- include "safespot-ops.dashboardLabels" . | nindent 4 }}
data:
{{- range $path, $file := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $file | indent 4 }}
{{- end }}