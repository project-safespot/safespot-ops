# ======================================================
# external-ingestion ServiceMonitor
# namespace: application
# Deployment 기준으로 수집 (CronJob은 수집 대상 아님)
# ServiceMonitor 리소스는 대상 서비스 namespace에 생성한다.
#   api-core / api-public-read / external-ingestion → application namespace
#   async-worker → worker namespace
#   redis / postgres exporter ServiceMonitor → monitoring namespace
# ======================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-ingestion
  namespace: application
  labels:
    release: monitoring
    app: external-ingestion
spec:
  selector:
    matchLabels:
      app: external-ingestion
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
  namespaceSelector:
    matchNames:
      - application
      