# ======================================================
# async-worker ServiceMonitor
# namespace: worker
# ServiceMonitor 리소스는 대상 서비스 namespace에 생성한다.
#   api-core / api-public-read / external-ingestion → application namespace
#   async-worker → worker namespace
#   redis / postgres exporter ServiceMonitor → monitoring namespace
# ======================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: async-worker
  namespace: worker
  labels:
    release: monitoring
    app: async-worker
spec:
  selector:
    matchLabels:
      app: async-worker
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
  namespaceSelector:
    matchNames:
      - worker
      