# ======================================================
# application-alerts.yaml
# 대상: application namespace (api-core, api-public-read, external-ingestion)
# release: monitoring 라벨 → kube-prometheus-stack ruleSelector와 일치
# ======================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: safespot-application-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: safespot.application.availability
      interval: 15s
      rules:
        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{condition="true", namespace="application"} == 0
          for: 5m
          labels:
            severity: warning
            env: dev
            namespace: application
          annotations:
            summary: "Pod not ready ({{ $labels.pod }})"
            description: "Pod {{ $labels.pod }} in namespace application has been not ready for 5 minutes."

        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="application"}
            != kube_deployment_status_available_replicas{namespace="application"}
          for: 5m
          labels:
            severity: warning
            env: dev
            namespace: application
          annotations:
            summary: "Deployment replicas mismatch ({{ $labels.deployment }})"
            description: "Deployment {{ $labels.deployment }} has fewer available replicas than desired."

        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="application"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
            env: dev
            namespace: application
          annotations:
            summary: "Pod crash looping ({{ $labels.pod }})"
            description: "Pod {{ $labels.pod }} is restarting frequently."
