# ======================================================
# kubernetes-alerts.yaml
# 대상: 클러스터 전체 Kubernetes 리소스 기준
# ======================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: safespot-kubernetes-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: safespot.kubernetes
      interval: 15s
      rules:
        - alert: NodeHighCpuUsage
          expr: |
            (1 - avg by(node)(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
          for: 5m
          labels:
            severity: warning
            env: dev
          annotations:
            summary: "Node CPU usage high ({{ $labels.node }})"
            description: "Node {{ $labels.node }} CPU usage exceeds 85%."

        - alert: NodeHighMemoryUsage
          expr: |
            (
              1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
            ) > 0.85
          for: 5m
          labels:
            severity: warning
            env: dev
          annotations:
            summary: "Node memory usage high ({{ $labels.node }})"
            description: "Node {{ $labels.node }} memory usage exceeds 85%."

        - alert: PersistentVolumeHighUsage
          expr: |
            (
              kubelet_volume_stats_used_bytes
              / kubelet_volume_stats_capacity_bytes
            ) > 0.80
          for: 5m
          labels:
            severity: warning
            env: dev
          annotations:
            summary: "PersistentVolume usage high ({{ $labels.persistentvolumeclaim }})"
            description: "PVC {{ $labels.persistentvolumeclaim }} usage exceeds 80%."
