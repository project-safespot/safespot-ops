apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-safespot-redis
  namespace: {{ .Values.namespaces.monitoring }}
  labels:
    {{- include "safespot-ops.labels" . | nindent 4 }}
    {{- include "safespot-ops.dashboardLabels" . | nindent 4 }}
data:
  safespot-redis.json: |
    {
      "title": "SafeSpot Redis",
      "uid": "safespot-redis",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "panels": []
    }